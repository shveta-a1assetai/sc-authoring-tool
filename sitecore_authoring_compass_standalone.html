        showToast(`Registered ${newSpec.name} in Component Library!`);
      };

      const savePagesData = (newPages) => {
        setPagesData(newPages);
        try {
          localStorage.setItem('sitecore_compass_pages', JSON.stringify(newPages));
        } catch(e){}
      };

      const updateQaStatus = (tcId, newStatus, note = '') => {
        const updated = {
          ...qaChecklistStatus,
          [tcId]: {
            status: newStatus,
            note: note || qaChecklistStatus[tcId]?.note || '',
            updatedAt: new Date().toLocaleTimeString()
          }
        };
        setQaChecklistStatus(updated);
        try {
          localStorage.setItem('sitecore_compass_qa_status', JSON.stringify(updated));
        } catch(e){}
      };

      // Dynamic Metrics
      const totalStats = useMemo(() => {
        const totalComponents = componentSpecs.length;
        const totalPages = Object.keys(pagesData).length;
        let totalRenderings = 0;
        let totalPersonalizations = 0;
        const compUsage = {};
        const placeholderCounts = {};

        Object.values(pagesData).forEach(page => {
          const phs = page.layout?.placeholders || {};
          Object.entries(phs).forEach(([phKey, comps]) => {
            if (Array.isArray(comps)) {
              totalRenderings += comps.length;
              placeholderCounts[phKey] = (placeholderCounts[phKey] || 0) + comps.length;
              comps.forEach(c => {
                const name = c.componentName || 'Unknown';
                compUsage[name] = (compUsage[name] || 0) + 1;
                if (c.hasPersonalization) totalPersonalizations += (c.personalizationCount || 1);
              });
            }
          });
        });

        // Calculate QA stats
        let totalQACases = 0;
        let passedQACases = 0;
        componentSpecs.forEach(c => {
          const cases = generateComponentQATestCases(c);
          totalQACases += cases.length;
          cases.forEach(tc => {
            const status = qaChecklistStatus[tc.id]?.status || tc.defaultStatus;
            if (status === 'PASS') passedQACases++;
          });
        });

        return {
          totalComponents,
          totalPages,
          totalRenderings,
          totalPersonalizations,
          compUsage,
          placeholderCounts,
          uniquePlaceholders: Object.keys(placeholderCounts).length,
          totalQACases,
          passedQACases,
          qaPassRate: totalQACases > 0 ? Math.round((passedQACases / totalQACases) * 100) : 100
        };
      }, [componentSpecs, pagesData, qaChecklistStatus]);

      const currentPage = useMemo(() => {
        return pagesData[selectedRoute] || pagesData['/'] || Object.values(pagesData)[0];
      }, [pagesData, selectedRoute]);

      const activeDocComponent = useMemo(() => {
        return componentSpecs.find(c => c.id === selectedComponentId) || componentSpecs[0];
      }, [componentSpecs, selectedComponentId]);

      // Builder Presets
      const handleApplyBuilderPreset = (presetKey) => {
        if (presetKey === 'HeroBanner') {
          setBuilderForm({
            preset: 'HeroBanner',
            name: 'HeroBanner',
            category: 'Marketing & Banners',
            description: 'Full-bleed high-impact showcase banner with headline, subdeck, primary/secondary CTAs, and background media overlay.',
            sxaModule: 'Navigation & Hero',
            allowedPlaceholders: ['headless-header', 'headless-main'],
            fields: [
              { id: 'f1', name: 'Headline', type: 'Single-Line Text', limit: '50-65 chars', required: true, description: 'H1 value proposition', mockValue: 'Next-Generation Composable CMS' },
              { id: 'f2', name: 'Subheading', type: 'Multi-Line Text', limit: '120-160 chars', required: false, description: 'Support statement', mockValue: 'Seamlessly author, personalize, and publish omnichannel content.' },
              { id: 'f3', name: 'PrimaryAction', type: 'General Link', limit: 'Single CTA', required: true, description: 'Main CTA button', mockValue: 'https://sitecore.com|Get Started Free' },
              { id: 'f4', name: 'DesktopMedia', type: 'Image', limit: '1920 × 800 px', required: true, description: 'Background hero visual', mockValue: 'https://images.unsplash.com/photo-1451187580459-43490279c0fa?w=1200&q=80' }
            ],
            renderingParams: [
              { id: 'p1', param: 'ThemeVariant', options: ['Dark Gradient (Default)', 'Light Clean', 'Brand Indigo'], default: 'Dark Gradient' },
              { id: 'p2', param: 'ContentAlignment', options: ['Left Aligned', 'Center Aligned'], default: 'Left Aligned' }
            ],
            options: { withDatasourceCheck: true, hasChildPlaceholder: false, childPlaceholderName: 'hero-extra', useSitecoreContext: true, includeStorybook: true }
          });
        } else if (presetKey === 'TestimonialCard') {
          setBuilderForm({
            preset: 'TestimonialCard',
            name: 'TestimonialCard',
            category: 'Cards & Teasers',
            description: 'Customer endorsement card with quote, author credentials, avatar image, and star rating.',
            sxaModule: 'Composables & Teasers',
            allowedPlaceholders: ['headless-main', 'col-left', 'col-right'],
            fields: [
              { id: 'f1', name: 'Quote', type: 'Rich Text', limit: '150-300 chars', required: true, description: 'Endorsement text', mockValue: '<p>"Sitecore + Next.js cut our time-to-market in half while giving our content team full Experience Editor autonomy."</p>' },
              { id: 'f2', name: 'AuthorName', type: 'Single-Line Text', limit: '50 chars', required: true, description: 'Customer name', mockValue: 'Sarah Jenkins' },
              { id: 'f3', name: 'AuthorTitle', type: 'Single-Line Text', limit: '60 chars', required: false, description: 'Job title & organization', mockValue: 'VP of Digital Experience, GlobalRetail' },
              { id: 'f4', name: 'AuthorAvatar', type: 'Image', limit: '200 × 200 px', required: false, description: 'Headshot photograph', mockValue: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=200&q=80' }
            ],
            renderingParams: [
              { id: 'p1', param: 'CardStyle', options: ['Quote Bubble', 'Minimal Card', 'Gradient Glow'], default: 'Quote Bubble' }
            ],
            options: { withDatasourceCheck: true, hasChildPlaceholder: false, childPlaceholderName: 'testimonial-footer', useSitecoreContext: true, includeStorybook: true }
          });
        } else if (presetKey === 'CallToAction') {
          setBuilderForm({
            preset: 'CallToAction',
            name: 'CallToAction',
            category: 'Conversion',
            description: 'Conversion ribbon prompting user signups, consultations, or newsletter subscriptions.',
            sxaModule: 'Conversion & Forms',
            allowedPlaceholders: ['headless-main', 'headless-footer'],
            fields: [
              { id: 'f1', name: 'PromptHeadline', type: 'Single-Line Text', limit: '40 chars', required: true, description: 'Urgency trigger', mockValue: 'Ready to Transform Your Authoring Workflow?' },
              { id: 'f2', name: 'PromptBody', type: 'Single-Line Text', limit: '100 chars', required: false, description: 'Brief incentive', mockValue: 'Deploy Next.js components to Sitecore Experience Editor in minutes.' },
              { id: 'f3', name: 'CtaButton', type: 'General Link', limit: 'Primary CTA', required: true, description: 'Action button', mockValue: 'https://sitecore.com|Schedule Demo' }
            ],
            renderingParams: [
              { id: 'p1', param: 'BackgroundShade', options: ['Gradient Accent', 'Solid Slate 900', 'White Inset'], default: 'Gradient Accent' }
            ],
            options: { withDatasourceCheck: true, hasChildPlaceholder: false, childPlaceholderName: 'cta-actions', useSitecoreContext: true, includeStorybook: true }
          });
        } else if (presetKey === 'CustomBlank') {
          setBuilderForm({
            preset: 'CustomBlank',
            name: 'CustomComponent',
            category: 'Cards & Teasers',
            description: 'Custom Next.js headless component editable in Sitecore Experience Editor.',
            sxaModule: 'Custom Modules',
            allowedPlaceholders: ['headless-main'],
            fields: [
              { id: 'f1', name: 'Title', type: 'Single-Line Text', limit: '60 chars', required: true, description: 'Main Title', mockValue: 'Custom Component Title' },
              { id: 'f2', name: 'Description', type: 'Rich Text', limit: '300 chars', required: false, description: 'Content text', mockValue: '<p>Custom content body...</p>' }
            ],
            renderingParams: [
              { id: 'p1', param: 'ThemeVariant', options: ['Default', 'Alternative'], default: 'Default' }

            options: { withDatasourceCheck: true, hasChildPlaceholder: false, childPlaceholderName: 'custom-slot', useSitecoreContext: true, includeStorybook: true }
          });
        } else {
          handleApplyBuilderPreset('HeroBanner');
        }
        showToast(`Loaded ${presetKey} preset`);
      };

      // Connection Ping
      const testConnection = async (targetEnv = currentEnv) => {
        setIsTestingConn(true);
        setConnectionStatus({
          state: 'testing',
          message: 'Pinging Layout Service...',
          detail: null,
          code: null,
          latency: null,
          testedUrl: targetEnv.endpoint,
          timestamp: new Date().toLocaleTimeString()
        });

        const startTime = performance.now();
        try {
          let fetchUrl = targetEnv.endpoint;
          let fetchOptions = { mode: 'cors', headers: {} };

          if (targetEnv.type === 'rest') {
            const sep = fetchUrl.includes('?') ? '&' : '?';
            fetchUrl = `${fetchUrl}${sep}item=${encodeURIComponent(selectedRoute)}&sc_apikey=${encodeURIComponent(targetEnv.apiKey)}&sc_site=${encodeURIComponent(targetEnv.siteName || 'mysite')}&sc_lang=${targetEnv.language || 'en'}`;
            fetchOptions.method = 'GET';
            fetchOptions.headers['Accept'] = 'application/json';
          } else {
            fetchOptions.method = 'POST';
            fetchOptions.headers['Content-Type'] = 'application/json';
            if (targetEnv.apiKey) fetchOptions.headers['sc_apikey'] = targetEnv.apiKey;
            fetchOptions.body = JSON.stringify({ query: 'query PingLayoutService { __typename }' });
          }

          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), 6500);
          fetchOptions.signal = controller.signal;

          const res = await fetch(fetchUrl, fetchOptions);
          clearTimeout(timeoutId);
          const duration = Math.round(performance.now() - startTime);

          if (res.ok) {
            setConnectionStatus({
              state: 'connected',
              message: `Service Online (${res.status} OK)`,
              detail: `Response in ${duration}ms. Endpoint accepting CORS requests.`,
              code: res.status,
              latency: `${duration}ms`,
              testedUrl: fetchUrl,
              timestamp: new Date().toLocaleTimeString()
            });
            showToast(`Connected to ${targetEnv.name} in ${duration}ms!`);
          } else {
            setConnectionStatus({
              state: 'error',
              message: `HTTP ${res.status}: ${res.statusText}`,
              detail: `Endpoint rejected request with code ${res.status}. Check API Key and site permissions.`,
              code: res.status,
              latency: `${duration}ms`,
              testedUrl: fetchUrl,
              timestamp: new Date().toLocaleTimeString()
            });
          }
        } catch (err) {
          const duration = Math.round(performance.now() - startTime);
          setConnectionStatus({
            state: 'failed',
            message: 'Endpoint Unreachable / CORS',
            detail: 'Failed to connect. 1) Accept local self-signed SSL cert in new tab. 2) Ensure Sitecore CORS origin * is allowed.',
            code: 'FETCH_ERROR',
            latency: `${duration}ms`,
            testedUrl: targetEnv.endpoint,
            timestamp: new Date().toLocaleTimeString()
          });
        } finally {
          setIsTestingConn(false);
        }
      };

      const openAddComponentModal = (initialCompId = 'HeroBanner', initialPlaceholder = 'headless-main', initialRoute = selectedRoute) => {
        const comp = componentSpecs.find(c => c.id === initialCompId) || componentSpecs[0];
        const initialParams = {};
        (comp.renderingParams || []).forEach(p => { initialParams[p.param] = p.default; });

        const routeLabel = initialRoute === '/' ? 'Home' : initialRoute.replace('/', '');
        const autoDsName = `${comp.name} Item`;
        const autoDsPath = `/sitecore/content/${routeLabel}/_Data/${comp.name}s/${autoDsName}`;

        setAddCompForm({
          targetRoute: initialRoute,
          newRouteName: '',
          componentId: comp.id,
          placeholder: initialPlaceholder || comp.allowedPlaceholders[0]?.key || 'headless-main',
          dataSourceName: autoDsName,
          dataSourceGuid: generateGuid(),
          dataSourcePath: autoDsPath,
          params: initialParams,
          position: 'bottom'
        });
        setAddComponentModalOpen(true);
      };

      const handleCommitAddComponent = () => {
        const targetRoute = (addCompForm.targetRoute === '__NEW__' ? addCompForm.newRouteName.trim() : addCompForm.targetRoute) || '/';
        const formattedRoute = targetRoute.startsWith('/') ? targetRoute : `/${targetRoute}`;

        const compSpec = componentSpecs.find(c => c.id === addCompForm.componentId) || componentSpecs[0];
        const newUid = 'r_' + Math.random().toString(36).substring(2, 8);

        const newRendering = {
          uid: newUid,
          componentName: compSpec.name,
          dataSource: addCompForm.dataSourceGuid,
          dataSourcePath: addCompForm.dataSourcePath,
          params: { ...addCompForm.params },
          hasPersonalization: false
        };

        const existingPage = pagesData[formattedRoute] || {
          name: formattedRoute === '/' ? 'Home' : formattedRoute.replace('/', '').replace(/-/g, ' '),
          template: 'Standard Content Route',
          itemId: generateGuid(),
          layout: { placeholders: {} },
          personalizations: []
        };

        const targetPh = addCompForm.placeholder || 'headless-main';
        const existingList = existingPage.layout.placeholders[targetPh] || [];

        const updatedList = addCompForm.position === 'top'
          ? [newRendering, ...existingList]
          : [...existingList, newRendering];

        const updatedPages = {
          ...pagesData,
          [formattedRoute]: {
            ...existingPage,
            layout: {
              ...existingPage.layout,
              placeholders: {
                ...existingPage.layout.placeholders,
                [targetPh]: updatedList
              }
            }
          }
        };

        savePagesData(updatedPages);
        setSelectedRoute(formattedRoute);
        setInspectingComponentUid(newUid);
        setActiveTab('layout');
        setAddComponentModalOpen(false);
        showToast(`Added ${compSpec.name} to ${formattedRoute}!`);
      };

      const handleRemoveComponent = (phKey, uid) => {
        if (!confirm('Remove this component from layout?')) return;
        const currentList = currentPage.layout.placeholders[phKey] || [];
        const updatedList = currentList.filter(c => c.uid !== uid);

        const updatedPages = {
          ...pagesData,
          [selectedRoute]: {
            ...currentPage,
            layout: {
              ...currentPage.layout,
              placeholders: {
                ...currentPage.layout.placeholders,
                [phKey]: updatedList
              }
            }
          }
        };
        savePagesData(updatedPages);
        showToast('Component removed from layout');
      };

      // Print PDF helper
      const handleTriggerPrint = (title, htmlContent) => {
        const printWindow = window.open('', '_blank');
        if (!printWindow) {
          showToast('Popup blocked! Please allow popups to print/export PDF.');
          return;
        }
        printWindow.document.write(htmlContent);
        printWindow.document.close();
        printWindow.focus();
        setTimeout(() => {
          printWindow.print();
        }, 500);
      };

      return (
        <div className="min-h-screen flex flex-col font-sans">
          
          {/* TOAST NOTIFICATION */}
          {toastMessage && (
            <div className="fixed top-5 right-5 z-50 flex items-center gap-3 bg-indigo-600/95 backdrop-blur-md text-white px-5 py-3 rounded-2xl shadow-2xl border border-indigo-400/30 text-sm font-semibold animate-bounce">
              <Icon name="checkCircle" className="w-5 h-5 text-emerald-300" />
              <span>{toastMessage}</span>
            </div>
          )}

          {/* TOP APP HEADER */}
          <header className="sticky top-0 z-40 glass-panel border-b border-slate-800/80 px-4 sm:px-6 lg:px-8 py-3.5 flex flex-wrap items-center justify-between gap-4">
            {/* Brand Logo & Title */}
            <div className="flex items-center gap-3.5">
              <div className="w-10 h-10 rounded-2xl bg-gradient-to-tr from-indigo-600 via-violet-600 to-rose-500 flex items-center justify-center text-white shadow-xl shadow-indigo-600/25 ring-1 ring-white/20">
                <Icon name="compass" className="w-5 h-5" />
              </div>
              <div>
                <div className="flex items-center gap-2.5">
                  <h1 className="text-base sm:text-lg font-extrabold text-white tracking-tight">Sitecore Authoring Compass</h1>
                  <span className="text-[10px] font-mono font-bold uppercase px-2 py-0.5 rounded-full bg-indigo-500/10 text-indigo-300 border border-indigo-500/20">
                    Next.js Studio & Docs
                  </span>
                </div>
                <p className="text-xs text-slate-400 hidden sm:block">Headless Experience Inspector, Component Scaffolder & QA Documentation Engine</p>
              </div>
            </div>

            {/* Quick Actions & Environment Switcher */}
            <div className="flex items-center flex-wrap gap-3">
              {/* PRIMARY ACTION: Documentation Studio */}
              <button
                onClick={() => {
                  setActiveTab('docs');
                  setDocMode('component');
                }}
                className={`px-4 py-2 rounded-xl text-xs font-bold flex items-center gap-2 shadow-lg transition-all active:scale-95 ${
                  activeTab === 'docs'
                    ? 'bg-gradient-to-r from-indigo-500 to-violet-600 text-white shadow-indigo-500/30 ring-2 ring-indigo-400'
                    : 'bg-gradient-to-r from-indigo-600 to-violet-700 hover:from-indigo-500 hover:to-violet-600 text-white shadow-indigo-600/20'
                }`}
              >
                <Icon name="bookOpen" className="w-4 h-4" />
                <span>Docs & Playbooks</span>
              </button>

              {/* ACTION: Next.js Studio */}
              <button
                onClick={() => setActiveTab('builder')}
                className={`px-3.5 py-2 rounded-xl text-xs font-bold flex items-center gap-1.5 transition-all active:scale-95 ${
                  activeTab === 'builder'
                    ? 'bg-emerald-500 text-slate-950 font-extrabold ring-2 ring-emerald-400'
                    : 'bg-slate-900 hover:bg-slate-800 text-emerald-400 border border-emerald-500/30'

                <Icon name="code" className="w-4 h-4" />
                <span>Studio</span>

              {/* ACTION: Add Component to Page */}
              <button
                onClick={() => openAddComponentModal('HeroBanner', 'headless-main', selectedRoute)}

              >
                <Icon name="plus" className="w-4 h-4 text-indigo-400" />

              </button>

              {/* Connection Status & Ping */}
              <div className="flex items-center gap-2 bg-slate-900/90 border border-slate-800 rounded-xl px-3 py-1.5 text-xs shadow-inner">

                  { id: 'dashboard', label: 'Architecture & Stats Dashboard', icon: 'dashboard' },

                        isActive
                          ? 'bg-gradient-to-r from-indigo-600 to-violet-600 text-white shadow-lg shadow-indigo-600/25'

                          ? 'text-indigo-300 hover:text-indigo-200 bg-indigo-950/40 hover:bg-indigo-900/40 border border-indigo-500/30'

                    >

                      <span>{tab.label}</span>
                      {tab.count !== undefined && (
                        <span className={`text-[11px] font-mono px-1.5 py-0.2 rounded-full ${

                          {tab.count}
                        </span>
                      )}
                    </button>

              </nav>

              <button
                onClick={() => setDiagModalOpen(true)}

              >

          </div>

          {/* MAIN APPLICATION BODY */}

            {/* ========================================================================= */}
            {/* TAB 1: DASHBOARD */}
            {/* ========================================================================= */}
            {activeTab === 'dashboard' && (
              <div className="space-y-8">

                  case 'Rich Text':
                    return '<RichText field={fields.' + varName + '} className="prose prose-invert max-w-none text-slate-300 text-sm leading-relaxed" />';
                  case 'Date':
                    return '<DateField field={fields.' + varName + '} className="text-xs text-slate-400 font-mono" />';
                  case 'Checkbox':
                    return '{fields.' + varName + '?.value && <span className="inline-block px-2.5 py-1 rounded-lg bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 text-xs font-bold">Featured</span>}';
                  case 'Single-Line Text':
                  case 'Multi-Line Text':

                    if (f.name.toLowerCase().includes('head') || f.name.toLowerCase().includes('title')) {
                      return '<h2 className="text-2xl sm:text-3xl font-black text-white tracking-tight"><Text field={fields.' + varName + '} /></h2>';

                    return '<p className="text-sm text-slate-300"><Text field={fields.' + varName + '} /></p>';
                }

              const generateTsxCode = () => {
                const hasText = builderForm.fields.some(f =>
                  ['Single-Line Text', 'Multi-Line Text'].includes(f.type) ||
                  !['Image', 'General Link', 'Rich Text', 'Date', 'Checkbox', 'Number'].includes(f.type)
                );
                const hasRichText = builderForm.fields.some(f => f.type === 'Rich Text');
                const hasImage = builderForm.fields.some(f => f.type === 'Image');
                const hasLink = builderForm.fields.some(f => f.type === 'General Link');
                const hasDateField = builderForm.fields.some(f => f.type === 'Date');
                const hasPlaceholder = Boolean(builderForm.options.hasChildPlaceholder);

                const hasField = builderForm.fields.some(f => !['Image', 'General Link'].includes(f.type));
                const hasImageField = builderForm.fields.some(f => f.type === 'Image');
                const hasLinkField = builderForm.fields.some(f => f.type === 'General Link');

                const jssImports = [];
                if (hasText) jssImports.push('Text');
                if (hasRichText) jssImports.push('RichText');
                if (hasImage) jssImports.push('Image');
                if (hasLink) jssImports.push('Link');
                if (hasDateField) jssImports.push('DateField');
                if (hasPlaceholder) jssImports.push('Placeholder');
                jssImports.push('useSitecoreContext');
                if (builderForm.options.withDatasourceCheck) {
                  jssImports.push('withDatasourceCheck');
                }
                if (hasField) jssImports.push('Field');
                if (hasImageField) jssImports.push('ImageField');
                if (hasLinkField) jssImports.push('LinkField');
                jssImports.push('ComponentParams');
                jssImports.push('ComponentRendering');

                const lines = [
                  "import { JSX } from 'react';",
                  "import {",
                  ...jssImports.map(imp => "  " + imp + ","),
                  "} from '@sitecore-jss/sitecore-jss-nextjs';",
                  "",
                  "export interface " + compName + "Fields {"
                ];

                builderForm.fields.forEach(f => {
                  const varName = f.name.charAt(0).toLowerCase() + f.name.slice(1);
                  lines.push("  " + varName + "?: " + getFieldTsType(f.type) + "; // " + (f.description || f.type));
                });

                lines.push("}");
                lines.push("");
                lines.push("export interface " + compName + "Props {");
                lines.push("  rendering: ComponentRendering;");
                lines.push("  params?: ComponentParams;");
                lines.push("  fields: " + compName + "Fields;");
                lines.push("}");
                lines.push("");
                const compArgs = hasPlaceholder ? '{ fields, params, rendering }' : '{ fields, params }';
                lines.push("export const " + compName + " = (" + compArgs + ": " + compName + "Props): JSX.Element => {");
                lines.push("  const { sitecoreContext } = useSitecoreContext();");
                lines.push("  const isEditing = sitecoreContext?.pageEditing;");
                lines.push("");
                lines.push("  // Fallback state for Experience Editor when content authors haven't selected a datasource item");
                lines.push("  if (!fields && isEditing) {");
                lines.push("    return (");
                lines.push('      <div className="border-2 border-dashed border-amber-500/80 bg-amber-500/10 p-6 rounded-2xl text-amber-300 font-mono text-xs space-y-1.5 my-4">');
                lines.push('        <div className="font-bold flex items-center gap-2">');
                lines.push('          <span>⚠️ Sitecore Experience Editor: ' + compName + '</span>');
                lines.push("        </div>");
                lines.push('        <p className="text-slate-300 font-sans">');
                lines.push("          No datasource item is attached to this component. Click on this component in Experience Editor / Pages to assign or create a datasource item.");
                lines.push("        </p>");
                lines.push("      </div>");
                lines.push("    );");
                lines.push("  }");
                lines.push("");
                lines.push("  if (!fields) return <></>;");
                lines.push("");
                const defaultVariant = (builderForm.renderingParams[0] && builderForm.renderingParams[0].default) || 'Default';
                lines.push("  const themeVariant = params?.ThemeVariant || '" + defaultVariant + "';");
                lines.push("");
                lines.push("  return (");
                lines.push('    <section className={`component ' + compName.toLowerCase() + ' py-8 px-4 max-w-6xl mx-auto ${themeVariant}`}>');
                lines.push('      <div className="bg-slate-900 border border-slate-800 rounded-3xl p-8 shadow-2xl space-y-6 relative overflow-hidden">');
                lines.push("        {/* Experience Editor Inline Editable Fields */}");
                lines.push('        <div className="space-y-4">');

                builderForm.fields.forEach(f => {
                  lines.push("          <div>");
                  lines.push("            " + getFieldComponent(f));
                  lines.push("          </div>");
                });

                lines.push("        </div>");

                if (builderForm.options.hasChildPlaceholder) {
                  const phName = builderForm.options.childPlaceholderName || 'child-content';
                  lines.push("");
                  lines.push("        {/* Nested Child Placeholder Container */}");
                  lines.push('        <div className="pt-6 border-t border-slate-800/80">');
                  lines.push('          <Placeholder name="' + phName + '" rendering={rendering} />');
                  lines.push("        </div>");
                }

                lines.push("      </div>");
                lines.push("    </section>");
                lines.push("  );");
                lines.push("};");
                lines.push("");

                if (builderForm.options.withDatasourceCheck) {
                  lines.push("export default withDatasourceCheck()<" + compName + "Props>(" + compName + ");");
                } else {
                  lines.push("export default " + compName + ";");
                }

                return lines.join('\n');
              };

              const generateScsTemplateYaml = () => {
                const lines = [
                  "---",
                  'ID: "' + generateGuid().replace(/[{}]/g, '') + '"',
                  'Parent: "00000000-0000-0000-0000-000000000000"',
                  'Template: "ab86861a-6030-46c5-b394-e7f9988a16cd" # Standard Template',
                  'Path: "' + templatePath + '"',
                  "SharedFields:",
                  '- ID: "12c332d5-4a5d-4ad9-a288-461976578070" # Base Templates',
                  '  Value: "{1930BBEB-7805-471A-A3C1-4E8A57A61F2C}" # Standard Template Base',
                  "Languages:",
                  "- Language: en",
                  "  Versions:",
                  "  - Version: 1",
                  "    Fields:",
                  '    - ID: "b5e02ad9-d56f-4c41-a065-a133db87bdeb" # __Display name',
                  '      Value: "' + builderForm.name + ' Item"',
                  "",
                  "---",
                  "# Template Fields Section: Data",
                  "# Fields:"
                ];

                builderForm.fields.forEach(f => {
                  lines.push("# - Field: " + f.name + " (Type: " + f.type + ", Limit: " + (f.limit || 'None') + ", Required: " + (f.required ? 'Yes' : 'No') + ")");
                });

                return lines.join('\n');
              };

              const generateScsRenderingYaml = () => {
                const lines = [
                  "---",
                  'ID: "' + generateGuid().replace(/[{}]/g, '') + '"',
                  'Parent: "00000000-0000-0000-0000-000000000000"',
                  'Template: "0469a472-79e1-4240-8a01-3d8282164e70" # Json Rendering Template',
                  'Path: "' + renderingPath + '"',
                  "SharedFields:",
                  '- ID: "037a3062-6f1e-4ea5-80ea-d0e60dbab604" # Component Name (Next.js Export Name)',
                  '  Value: "' + compName + '"',
                  '- ID: "b5b27af1-25ef-405c-87ce-369b3a004016" # Datasource Location Query',
                  '  Value: "query:$site/*[@@name=\'Data\']/*[@@name=\'' + compName + 's\']"',
                  '- ID: "1a7c85e5-dc0b-490d-9187-bb1dbcb4c72f" # Datasource Template',
                  '  Value: "' + templatePath + '"',
                  '- ID: "a77e5d32-e969-4253-ab0d-2788e38ff54f" # Allowed Placeholders',
                  '  Value: "' + builderForm.allowedPlaceholders.join('|') + '"',
                  "Languages:",
                  "- Language: en",
                  "  Versions:",
                  "  - Version: 1",
                  "    Fields:",
                  '    - ID: "b5e02ad9-d56f-4c41-a065-a133db87bdeb" # __Display name',
                  '      Value: "' + builderForm.name + '"'
                ];

                return lines.join('\n');
              };

              const generateGqlMutation = () => {
                const lines = [
                  "mutation Create" + compName + "InSitecoreAuthoring {",
                  "  # 1. Create Data Template for " + compName,
                  "  createTemplate(",
                  "    input: {",
                  '      name: "' + compName + ' Item"',
                  '      parent: "/sitecore/templates/Project/Components/' + category + '"',
                  "      fields: ["
                ];

                builderForm.fields.forEach(f => {
                  lines.push('        { name: "' + f.name + '", type: "' + f.type + '", shared: false }');
                });

                lines.push("      ]");
                lines.push("    }");
                lines.push("  ) {");
                lines.push("    template {");
                lines.push("      id");
                lines.push("      path");
                lines.push("    }");
                lines.push("  }");
                lines.push("");
                lines.push("  # 2. Create JSON Rendering definition for Next.js");
                lines.push("  createJsonRendering(");
                lines.push("    input: {");
                lines.push('      name: "' + compName + '"');
                lines.push('      parent: "/sitecore/layout/Renderings/Project/' + category + '"');
                lines.push('      componentName: "' + compName + '"');
                lines.push('      datasourceLocation: "query:$site/*[@@name=\'Data\']/*[@@name=\'' + compName + 's\']"');
                lines.push('      datasourceTemplate: "' + templatePath + '"');
                lines.push('      placeholders: [' + builderForm.allowedPlaceholders.map(p => '"' + p + '"').join(', ') + ']');
                lines.push("    }");
                lines.push("  ) {");
                lines.push("    rendering {");
                lines.push("      id");
                lines.push("      path");
                lines.push("      componentName");
                lines.push("    }");
                lines.push("  }");
                lines.push("}");

                return lines.join('\n');
              };

              const generateSpeScript = () => {
                const lines = [
                  "# =========================================================================",
                  "# Sitecore PowerShell Extensions (SPE) Automation Script",
                  "# Component: " + compName,
                  "# Automatically generates Template, Standard Values, and JSON Rendering",
                  "# =========================================================================",
                  "",
                  '$templateFolder = "master:/sitecore/templates/Project/Components/' + category + '"',
                  '$renderingFolder = "master:/sitecore/layout/Renderings/Project/' + category + '"',
                  "",
                  "# 1. Ensure Folders Exist",
                  'if (!(Test-Path $templateFolder)) { New-Item -Path $templateFolder -ItemType "Template Folder" -Force }',
                  'if (!(Test-Path $renderingFolder)) { New-Item -Path $renderingFolder -ItemType "Item" -Force }',
                  "",
                  "# 2. Create Data Template",
                  '$templatePath = "$templateFolder/' + compName + ' Item"',
                  '$template = New-Item -Path $templatePath -ItemType "Template" -Force',
                  '$section = New-Item -Path "$templatePath/Data" -ItemType "Template section" -Force',
                  ""
                ];

                builderForm.fields.forEach(f => {
                  lines.push('$f_' + f.name + ' = New-Item -Path "$templatePath/Data/' + f.name + '" -ItemType "Template field" -Force');
                  lines.push('$f_' + f.name + '.Editing.BeginEdit()');
                  lines.push('$f_' + f.name + '["Type"] = "' + f.type + '"');
                  lines.push('$f_' + f.name + '["Title"] = "' + f.name + '"');
                  lines.push('$f_' + f.name + '.Editing.EndEdit()');
                  lines.push('');
                });

                lines.push("# 3. Create JSON Rendering Item");
                lines.push('$jsonRenderingTemplate = Get-Item "master:/sitecore/templates/Foundation/JavaScript Services/Json Rendering"');
                lines.push('$rendering = New-Item -Path "$renderingFolder/' + compName + '" -ItemType $jsonRenderingTemplate.ID -Force');
                lines.push('');
                lines.push('$rendering.Editing.BeginEdit()');
                lines.push('$rendering["Component Name"] = "' + compName + '"');
                lines.push('$rendering["Datasource Template"] = $template.ID.ToString()');
                lines.push('$rendering["Datasource Location"] = "query:`$site/*[@@name=\'Data\']/*[@@name=\'' + compName + 's\']"');
                lines.push('$rendering.Editing.EndEdit()');
                lines.push('');
                lines.push('Write-Host "✅ Successfully provisioned ' + compName + ' Next.js component in Sitecore CM!" -ForegroundColor Green');

                return lines.join('\n');
              };

                            Next.js Studio & Experience Editor Scaffolder

                        >

                        </button>

                        <button

                            ))}
                          </div>

                          <div className="flex items-center gap-2.5">
                            <button
                              onClick={() => {
                                let code = '';
                                if (builderArtifactTab === 'tsx') code = generatedTsxCode;
                                else if (builderArtifactTab === 'scs') code = generatedScsTemplateYaml + '\n' + generatedScsRenderingYaml;
                                else if (builderArtifactTab === 'graphql') code = generatedGqlMutation;
                                else if (builderArtifactTab === 'spe') code = generatedSpeScript;
                                else code = JSON.stringify(sandboxMockValues, null, 2);
                                copyToClipboard(code, builderArtifactTab.toUpperCase());
                              }}
                              className="px-3.5 py-2 bg-slate-900 hover:bg-slate-800 text-slate-200 rounded-xl text-xs font-bold flex items-center gap-1.5 border border-slate-800 transition-all"
                            >
                              <Icon name="copy" className="w-4 h-4" />
                              <span>Copy</span>
                            </button>
                          </div>
                        </div>

                        {/* TAB 1: NEXT.JS TSX */}
                        {builderArtifactTab === 'tsx' && (
                          <div className="space-y-3">
                            <div className="flex items-center justify-between text-xs text-slate-400 font-mono">
                              <span>Path: <strong className="text-white">src/components/{compName}.tsx</strong></span>
                              <span className="text-emerald-400 font-bold">Auto-registered by Component Factory</span>
                            </div>
                            <pre className="text-xs font-mono text-indigo-300 bg-slate-950 p-6 rounded-2xl border border-slate-800/80 overflow-x-auto max-h-[560px] leading-relaxed select-all">
                              {generatedTsxCode}
                            </pre>
                          </div>
                        )}

                        {/* TAB 2: LIVE EXPERIENCE EDITOR SANDBOX */}
                        {builderArtifactTab === 'sandbox' && (
                          <div className="space-y-5">
                            <div className="glass-panel p-4 rounded-2xl flex flex-wrap items-center justify-between gap-4">
                              <div className="flex items-center gap-3">
                                <span className="text-xs font-bold text-slate-300">Mode:</span>
                                <div className="flex bg-slate-900 border border-slate-800 rounded-xl p-1">
                                  <button
                                    onClick={() => setSandboxMode('edit')}
                                    className={`px-3.5 py-1.5 text-xs font-bold rounded-lg transition-all ${
                                      sandboxMode === 'edit' ? 'bg-amber-500 text-slate-950 shadow-md' : 'text-slate-400 hover:text-white'
                                    }`}
                                  >
                                    🛠️ Experience Editor (Edit Mode)
                                  </button>
                                  <button
                                    onClick={() => setSandboxMode('visitor')}
                                    className={`px-3.5 py-1.5 text-xs font-bold rounded-lg transition-all ${
                                      sandboxMode === 'visitor' ? 'bg-emerald-500 text-slate-950 shadow-md' : 'text-slate-400 hover:text-white'
                                    }`}
                                  >
                                    👁️ Visitor (Live Render)
                                  </button>
                                </div>
                              </div>
                            </div>

                            <div className="bg-slate-950 rounded-3xl border-2 border-slate-800 p-6 space-y-4">
                              {sandboxMode === 'edit' && (
                                <div className="text-amber-300 text-xs font-bold flex items-center gap-2">
                                  <span className="w-2.5 h-2.5 rounded-full bg-amber-400 animate-pulse"></span>
                                  <span>Sitecore Experience Editor • Live Inline Editable Preview</span>
                                </div>
                              )}
                              <div className="p-6 bg-slate-900 rounded-2xl space-y-4 border border-slate-800">
                                <h3 className="text-xl font-black text-white">{builderForm.fields[0]?.mockValue || compName}</h3>
                                <p className="text-sm text-slate-300">{builderForm.fields[1]?.mockValue || 'Editable content body.'}</p>
                              </div>
                            </div>
                          </div>
                        )}

                        {/* TAB 3: SCS YAML */}
                        {builderArtifactTab === 'scs' && (
                          <div className="space-y-4">
                            <pre className="text-xs font-mono text-teal-300 bg-slate-950 p-5 rounded-2xl border border-slate-800 overflow-x-auto max-h-[400px]">
                              {generatedScsRenderingYaml}
                            </pre>
                          </div>
                        )}

                        {/* TAB 4: GRAPHQL */}
                        {builderArtifactTab === 'graphql' && (
                          <div className="space-y-4">
                            <pre className="text-xs font-mono text-violet-300 bg-slate-950 p-6 rounded-2xl border border-slate-800 overflow-x-auto max-h-[500px]">
                              {generatedGqlMutation}
                            </pre>
                          </div>
                        )}

                        {/* TAB 5: SPE */}
                        {builderArtifactTab === 'spe' && (
                          <div className="space-y-4">
                            <pre className="text-xs font-mono text-amber-300 bg-slate-950 p-6 rounded-2xl border border-slate-800 overflow-x-auto max-h-[500px]">
                              {generatedSpeScript}
                            </pre>
                          </div>
                        )}

                      </div>
                    </div>

                  </div>
                </div>
              );
            })()}

            {/* ========================================================================= */}
            {/* TAB 5: COMPONENT LIBRARY & SPECS */}
            {/* ========================================================================= */}
            {activeTab === 'guide' && (() => {
              const activeComp = componentSpecs.find(c => c.id === selectedComponentId) || componentSpecs[0];
              const filteredComps = componentSpecs.filter(c =>
                c.name.toLowerCase().includes(componentSearch.toLowerCase()) ||
                c.category.toLowerCase().includes(componentSearch.toLowerCase())
              );

              return (
                <div className="grid grid-cols-1 lg:grid-cols-12 gap-8">
                  {/* Left Column: Component List */}
                  <div className="lg:col-span-4 space-y-4">
                    <div className="glass-panel rounded-3xl p-5 space-y-4">
                      <div className="relative">
                        <Icon name="search" className="w-4 h-4 text-slate-400 absolute left-3.5 top-3" />
                        <input
                          type="text"
                          value={componentSearch}
                          onChange={(e) => setComponentSearch(e.target.value)}
                          placeholder="Search renderings..."
                          className="w-full bg-slate-900 border border-slate-800 rounded-xl pl-10 pr-4 py-2 text-white text-xs focus:border-indigo-500 focus:outline-none"
                        />
                      </div>

                      <div className="space-y-2 max-h-[600px] overflow-y-auto pr-1">
                        {filteredComps.map((c) => (
                          <div
                            key={c.id}
                            onClick={() => setSelectedComponentId(c.id)}
                            className={`glass-card p-4 rounded-2xl cursor-pointer transition-all border ${
                              selectedComponentId === c.id ? 'border-indigo-500 bg-indigo-950/20' : 'hover:border-slate-700'
                            }`}
                          >
                            <div className="text-sm font-bold text-white">{c.name}</div>
                            <div className="text-xs text-slate-400">{c.category}</div>
                          </div>
                        ))}
                      </div>
                    </div>
                  </div>

                  {/* Right Column: Spec Sheet & Quick Doc Action */}
                  <div className="lg:col-span-8 space-y-6">
                    <div className="glass-panel rounded-3xl p-8 space-y-6 border border-slate-800/80 shadow-2xl">
                      <div className="flex items-center justify-between border-b border-slate-800/80 pb-4">
                        <div>
                          <h2 className="text-2xl font-black text-white">{activeComp.name}</h2>
                          <p className="text-xs text-slate-400 mt-1">{activeComp.description}</p>
                        </div>

                        <div className="flex items-center gap-3">
                          <button
                            onClick={() => {
                              setSelectedComponentId(activeComp.id);
                              setActiveTab('docs');
                              setDocMode('component');
                            }}
                            className="px-4 py-2 bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 text-white rounded-xl text-xs font-bold flex items-center gap-1.5 transition-all shadow-lg"
                          >
                            <Icon name="bookOpen" className="w-4 h-4" />
                            <span>Open in Docs Studio</span>
                          </button>
                        </div>
                      </div>

                      {/* Fields Table */}
                      <div className="space-y-4">
                        <h3 className="text-xs font-bold uppercase tracking-wider text-slate-300 flex items-center gap-2">
                          <Icon name="database" className="w-4 h-4 text-cyan-400" />
                          Fields Specification
                        </h3>
                        <div className="glass-card rounded-2xl overflow-hidden border border-slate-800">
                          <table className="w-full text-left text-xs">
                            <thead className="bg-slate-900 border-b border-slate-800 text-slate-400">
                              <tr>
                                <th className="p-3">Field Name</th>
                                <th className="p-3">Type</th>
                                <th className="p-3">Limits</th>
                                <th className="p-3">Required</th>
                              </tr>
                            </thead>
                            <tbody className="divide-y divide-slate-800">
                              {activeComp.fields.map((f, i) => (
                                <tr key={i} className="hover:bg-slate-900/50">
                                  <td className="p-3 font-mono font-bold text-white">{f.name}</td>
                                  <td className="p-3 text-indigo-300 font-mono">{f.type}</td>
                                  <td className="p-3 text-slate-400">{f.limit}</td>
                                  <td className="p-3">{f.required ? <span className="text-rose-400 font-bold">Yes</span> : <span className="text-slate-500">No</span>}</td>
                                </tr>
                              ))}
                            </tbody>
                          </table>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              );
            })()}

            {/* ========================================================================= */}
            {/* TAB 6: GRAPHQL & LAYOUT SERVICE EXPLORER */}
            {/* ========================================================================= */}
            {activeTab === 'graphql' && (
              <div className="glass-panel rounded-3xl p-8 space-y-6 border border-slate-800/80 shadow-2xl">
                <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-slate-800/80 pb-5">
                  <div className="space-y-1">
                    <h2 className="text-xl font-black text-white flex items-center gap-2.5">
                      <Icon name="terminal" className="w-5 h-5 text-indigo-400" />
                      Layout Service & GraphQL Edge Explorer
                    </h2>
                    <p className="text-xs text-slate-400">Live request inspector for route payloads and rendering data.</p>
                  </div>

                  <div className="flex items-center gap-3">
                    <button
                      onClick={() => testConnection(currentEnv)}
                      disabled={isTestingConn}
                      className="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl text-xs font-bold flex items-center gap-2 shadow-lg shadow-emerald-600/25 active:scale-95 transition-all"
                    >
                      <Icon name="zap" className={`w-4 h-4 ${isTestingConn ? 'animate-spin' : ''}`} />
                      <span>{isTestingConn ? 'Testing...' : 'Execute Live Query'}</span>
                    </button>
                  </div>
                </div>

                <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
                  <div className="lg:col-span-6 space-y-3">
                    <span className="text-xs font-mono font-bold text-slate-300">Request Configuration</span>
                    <div className="bg-slate-950 p-5 rounded-2xl border border-slate-800 text-xs font-mono space-y-2 text-indigo-300 break-all">
                      <div>Endpoint: {currentEnv.endpoint}</div>
                      <div>Site: {currentEnv.siteName || 'mysite'}</div>
                      <div>API Key: {currentEnv.apiKey}</div>
                    </div>
                  </div>

                  <div className="lg:col-span-6 space-y-3">
                    <span className="text-xs font-mono font-bold text-emerald-400">Live Response Payload</span>
                    <div className="bg-slate-950 p-5 rounded-2xl border border-slate-800 text-xs font-mono text-emerald-300 max-h-[400px] overflow-y-auto">
                      {JSON.stringify(currentPage, null, 2)}
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* ========================================================================= */}
            {/* TAB 7: PERSONALIZATION MATRIX */}
            {/* ========================================================================= */}
            {activeTab === 'personalization' && (
              <div className="glass-panel rounded-3xl p-8 space-y-6 border border-slate-800/80 shadow-2xl">
                <div className="space-y-1 border-b border-slate-800/80 pb-4">
                  <h2 className="text-xl font-black text-white flex items-center gap-2.5">
                    <Icon name="users" className="w-5 h-5 text-amber-400" />
                    Personalization & Audience Matrix
                  </h2>
                  <p className="text-xs text-slate-400">Configure conditional renderings and audience targeting for headless components.</p>
                </div>

                <div className="glass-card rounded-2xl p-6 text-center text-xs text-slate-400 space-y-2">
                  <Icon name="sparkles" className="w-8 h-8 text-amber-400 mx-auto" />
                  <p className="font-semibold text-slate-200">Headless Personalization Rules Active</p>
                  <p className="max-w-md mx-auto text-slate-400">Personalization rules attached to renderings in Sitecore Experience Edge are dynamically delivered via the Layout Service JSON.</p>
                </div>
              </div>
            )}

          </main>

          {/* ADD COMPONENT TO PAGE MODAL */}
          {addComponentModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md">
              <div className="glass-panel rounded-3xl max-w-xl w-full p-6 sm:p-8 space-y-5 shadow-2xl border border-slate-800">
                <div className="flex items-center justify-between border-b border-slate-800 pb-4">
                  <h3 className="text-base font-bold text-white flex items-center gap-2.5">
                    <Icon name="plus" className="w-5 h-5 text-indigo-400" />
                    Insert Component into Page Layout
                  </h3>
                  <button onClick={() => setAddComponentModalOpen(false)} className="text-slate-400 hover:text-white p-1">
                    <Icon name="x" className="w-5 h-5" />
                  </button>
                </div>

                <div className="space-y-4 text-xs">
                  <div className="grid grid-cols-2 gap-4">
                    <div>
                      <label className="text-slate-300 block mb-1.5 font-bold">Target Route</label>
                      <select
                        value={addCompForm.targetRoute}
                        onChange={(e) => setAddCompForm(f => ({ ...f, targetRoute: e.target.value }))}
                        className="w-full bg-slate-900 border border-slate-800 rounded-xl px-3.5 py-2.5 text-white font-mono text-xs focus:border-indigo-500 focus:outline-none"
                      >
                        {Object.keys(pagesData).map(r => (
                          <option key={r} value={r}>{r}</option>
                        ))}
                      </select>
                    </div>

                    <div>
                      <label className="text-slate-300 block mb-1.5 font-bold">Component</label>
                      <select
                        value={addCompForm.componentId}
                        onChange={(e) => {
                          const cid = e.target.value;
                          const comp = componentSpecs.find(c => c.id === cid) || componentSpecs[0];
                          const defParams = {};
                          (comp.renderingParams || []).forEach(p => { defParams[p.param] = p.default; });
                          setAddCompForm(f => ({
                            ...f,
                            componentId: cid,
                            placeholder: comp.allowedPlaceholders?.[0]?.key || 'headless-main',
                            dataSourceName: `${comp.name} Item`,
                            dataSourcePath: `/sitecore/content/Home/_Data/${comp.name}s/${comp.name} Item`,
                            params: defParams
                          }));
                        }}
                        className="w-full bg-slate-900 border border-slate-800 rounded-xl px-3.5 py-2.5 text-white text-xs focus:border-indigo-500 focus:outline-none"
                      >
                        {componentSpecs.map(c => (
                          <option key={c.id} value={c.id}>{c.name} ({c.category})</option>
                        ))}
                      </select>
                    </div>
                  </div>

                  <div>
                    <label className="text-slate-300 block mb-1.5 font-bold">Target Placeholder</label>
                    <select
                      value={addCompForm.placeholder}
                      onChange={(e) => setAddCompForm(f => ({ ...f, placeholder: e.target.value }))}
                      className="w-full bg-slate-900 border border-slate-800 rounded-xl px-3.5 py-2.5 text-white font-mono text-xs focus:border-indigo-500 focus:outline-none"
                    >
                      {['headless-header', 'headless-main', 'headless-footer', 'col-left', 'col-right'].map(ph => (
                        <option key={ph} value={ph}>{ph}</option>
                      ))}
                    </select>
                  </div>
                </div>

                <div className="flex items-center justify-end gap-3 pt-4 border-t border-slate-800">
                  <button
                    onClick={() => setAddComponentModalOpen(false)}
                    className="px-4 py-2 text-xs text-slate-400 hover:text-white"
                  >
                    Cancel
                  </button>
                  <button
                    onClick={handleCommitAddComponent}
                    className="px-5 py-2.5 bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 text-white rounded-xl text-xs font-bold shadow-lg shadow-indigo-600/30 active:scale-95 transition-all"
                  >
                    Insert to Layout
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* DIAGNOSTICS MODAL */}
          {diagModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md">
              <div className="glass-panel rounded-3xl max-w-2xl w-full p-6 sm:p-8 space-y-5 shadow-2xl border border-slate-800">
                <div className="flex items-center justify-between border-b border-slate-800 pb-4">
                  <h3 className="text-base font-bold text-white flex items-center gap-2.5">
                    <Icon name="alertTriangle" className="w-5 h-5 text-amber-400" />
                    Local Layout Service Diagnostics & SSL Setup
                  </h3>
                  <button onClick={() => setDiagModalOpen(false)} className="text-slate-400 hover:text-white p-1">
                    <Icon name="x" className="w-5 h-5" />
                  </button>
                </div>

                <div className="space-y-4 text-xs leading-relaxed text-slate-300">
                  <div className="p-4 bg-slate-900 rounded-2xl border border-slate-800 space-y-1.5">
                    <div className="font-bold text-indigo-300">1. Trust Self-Signed SSL Certificate</div>
                    <p className="text-slate-400">If your CM is hosted on `https://cm.local` or a dev container, open the endpoint in a new tab once and click "Advanced -> Proceed to site" to trust the SSL certificate for this browser session.</p>
                  </div>

                  <div className="p-4 bg-slate-900 rounded-2xl border border-slate-800 space-y-1.5">
                    <div className="font-bold text-indigo-300">2. Enable CORS in Sitecore Config</div>
                    <p className="text-slate-400">Ensure `Sitecore.Services.Client.config` includes `<origin>*</origin>` so client browsers can fetch the Layout Service directly.</p>
                  </div>
                </div>

                <div className="flex justify-end pt-4 border-t border-slate-800">
                  <button
                    onClick={() => {
                      setDiagModalOpen(false);
                      testConnection(currentEnv);
                    }}
                    className="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-xs font-bold"
                  >
                    Re-test Endpoint
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* SETTINGS MODAL */}
          {settingsOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md">
              <div className="glass-panel rounded-3xl max-w-lg w-full p-6 sm:p-8 space-y-5 shadow-2xl border border-slate-800">
                <div className="flex items-center justify-between border-b border-slate-800 pb-4">
                  <h3 className="text-base font-bold text-white flex items-center gap-2.5">
                    <Icon name="settings" className="w-5 h-5 text-indigo-400" />
                    Layout Service Settings
                  </h3>
                  <button onClick={() => setSettingsOpen(false)} className="text-slate-400 hover:text-white p-1">
                    <Icon name="x" className="w-5 h-5" />
                  </button>
                </div>

                <div className="space-y-4 text-xs">
                  <div>
                    <label className="text-slate-300 block mb-1.5 font-bold">Endpoint URL</label>
                    <input
                      type="text"
                      value={currentEnv.endpoint}
                      onChange={(e) => {
                        const val = e.target.value;
                        setEnvironments(prev => prev.map(env => env.id === currentEnv.id ? { ...env, endpoint: val } : env));
                      }}
                      className="w-full bg-slate-900 border border-slate-800 rounded-xl px-3.5 py-2 text-white font-mono text-xs focus:border-indigo-500 focus:outline-none"
                    />
                  </div>

                  <div>
                    <label className="text-slate-300 block mb-1.5 font-bold">Sitecore API Key</label>
                    <input
                      type="text"
                      value={currentEnv.apiKey}
                      onChange={(e) => {
                        const val = e.target.value;
                        setEnvironments(prev => prev.map(env => env.id === currentEnv.id ? { ...env, apiKey: val } : env));
                      }}
                      className="w-full bg-slate-900 border border-slate-800 rounded-xl px-3.5 py-2 text-white font-mono text-xs focus:border-indigo-500 focus:outline-none"
                    />
                  </div>
                </div>

                <div className="flex justify-end gap-3 pt-4 border-t border-slate-800">
                  <button onClick={() => setSettingsOpen(false)} className="px-4 py-2 text-xs text-slate-400 hover:text-white">
                    Close
                  </button>
                  <button
                    onClick={() => {
                      localStorage.setItem('sitecore_compass_envs', JSON.stringify(environments));
                      setSettingsOpen(false);
                      showToast('Saved settings');
                    }}
                    className="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-xs font-bold"
                  >
                    Save Changes
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
