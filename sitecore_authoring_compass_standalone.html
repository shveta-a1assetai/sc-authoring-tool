      const currentPage = useMemo(() => {

      // --- Build REST Layout Service URL ---
      const buildRestLayoutUrl = useCallback((env = currentEnv, route = selectedRoute) => {

          const base = env.endpoint.trim();
          const url = new URL(base.startsWith('http') ? base : `http://${base}`);
          url.searchParams.set('item', route);
          if (env.apiKey) url.searchParams.set('sc_apikey', env.apiKey);
          if (env.siteName) url.searchParams.set('sc_site', env.siteName);
          if (env.language) url.searchParams.set('sc_lang', env.language);
          return url.toString();
        } catch {
          return `${env.endpoint}?item=${route}&sc_apikey=${env.apiKey}&sc_site=${env.siteName}&sc_lang=${env.language}`;
        }
      }, [currentEnv, selectedRoute]);

      // --- Build GraphQL Query Body ---
      const standardGraphqlLayoutQuery = useMemo(() => {
        return `query GetLayoutServiceData($site: String!, $route: String!, $lang: String!) {
  layout(site: $site, routePath: $route, language: $lang) {
    item {
      id
      name
      rendered
    }
  }
}

# Variables
{
  "site": "${currentEnv.siteName || 'mysite'}",
  "route": "${selectedRoute}",
  "lang": "${currentEnv.language || 'en'}"
}`;
      }, [currentEnv, selectedRoute]);

      // --- Generate cURL Command ---
      const generatedCurlCommand = useMemo(() => {
        const isRest = currentEnv.type === 'rest' || currentEnv.endpoint.includes('/layout/render/');
        if (isRest) {
          const url = buildRestLayoutUrl(currentEnv, selectedRoute);
          return `curl -X GET "${url}" ${currentEnv.authToken ? `-H "Authorization: ${currentEnv.authToken}"` : ''} -H "Accept: application/json"`;
        } else {
          const cleanQuery = standardGraphqlLayoutQuery.split('\n# Variables')[0].trim();
          const vars = {
            site: currentEnv.siteName || 'mysite',
            route: selectedRoute,
            lang: currentEnv.language || 'en'
          };
          const jsonBody = JSON.stringify({ query: cleanQuery, variables: vars });
          return `curl -X POST "${currentEnv.endpoint}" \\
  -H "Content-Type: application/json" \\
  -H "sc_apikey: ${currentEnv.apiKey}" \\
  ${currentEnv.authToken ? `-H "Authorization: ${currentEnv.authToken}" \\` : ''}
  -d '${jsonBody.replace(/'/g, "\\'")}'`;
        }
      }, [currentEnv, selectedRoute, buildRestLayoutUrl, standardGraphqlLayoutQuery]);

      // --- Live Connection Health Test / Ping ---
      const testConnection = async (targetEnv = currentEnv) => {
        setIsTestingConn(true);
        setConnectionStatus({
          state: 'testing',
          message: `Pinging ${targetEnv.name}...`,
          detail: null,
          code: null,
          latency: null,
          testedUrl: targetEnv.endpoint,
          timestamp: new Date().toLocaleTimeString()
        });

        const startTime = performance.now();
        const isRest = targetEnv.type === 'rest' || targetEnv.endpoint.includes('/layout/render/');

        try {
          let fetchUrl = targetEnv.endpoint;
          let fetchOptions = {
            mode: 'cors',
            headers: {}
          };

          if (isRest) {
            fetchUrl = buildRestLayoutUrl(targetEnv, '/');
            fetchOptions.method = 'GET';
            fetchOptions.headers['Accept'] = 'application/json';
            if (targetEnv.authToken) fetchOptions.headers['Authorization'] = targetEnv.authToken;
          } else {
            if (targetEnv.apiKey) {
              const sep = fetchUrl.includes('?') ? '&' : '?';
              fetchUrl = `${fetchUrl}${sep}sc_apikey=${encodeURIComponent(targetEnv.apiKey)}`;
            }
            fetchOptions.method = 'POST';
            fetchOptions.headers['Content-Type'] = 'application/json';
            if (targetEnv.apiKey) {
              fetchOptions.headers['sc_apikey'] = targetEnv.apiKey;
            }
            if (targetEnv.authToken) fetchOptions.headers['Authorization'] = targetEnv.authToken;
            fetchOptions.body = JSON.stringify({
              query: `query PingLayoutService { __typename }`
            });
          }

          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), 6500);
          fetchOptions.signal = controller.signal;

          const res = await fetch(fetchUrl, fetchOptions);
          clearTimeout(timeoutId);
          const duration = Math.round(performance.now() - startTime);

          if (res.ok) {
            setConnectionStatus({
              state: 'connected',
              message: `Live layout service reachable (${res.status} ${res.statusText || 'OK'})`,
              detail: `Response received in ${duration}ms. Endpoint is online and accepting CORS requests.`,
              code: res.status,
              latency: `${duration}ms`,
              testedUrl: fetchUrl,
              timestamp: new Date().toLocaleTimeString()
            });
            showToast(`Connected to ${targetEnv.name} in ${duration}ms!`);
          } else {
            let errorBody = '';
            try {
              const ej = await res.json();
              errorBody = ej.message || ej.errors?.[0]?.message || JSON.stringify(ej);
            } catch {
              errorBody = await res.text();
            }

            let diagnostic = `Server responded with HTTP ${res.status}.`;
            if (res.status === 401 || res.status === 403) {
              diagnostic = `Authentication Error (${res.status}): The Sitecore API Key "${targetEnv.apiKey}" is invalid or unauthorized for site "${targetEnv.siteName}". Clear dummy Bearer token in Settings if unused.`;
            } else if (res.status === 404) {
              diagnostic = `Not Found (${res.status}): Layout Service endpoint path was not found on this host.`;
            }

            setConnectionStatus({
              state: 'error',
              message: `HTTP ${res.status}: ${res.statusText || 'Request Rejected'}`,
              detail: diagnostic + (errorBody ? ` Details: ${errorBody.slice(0, 180)}` : ''),
              code: res.status,
              latency: `${duration}ms`,
              testedUrl: fetchUrl,
              timestamp: new Date().toLocaleTimeString()
            });
          }
        } catch (err) {
          const duration = Math.round(performance.now() - startTime);
          let detail = 'Network error or endpoint unreachable.';

          if (err.name === 'AbortError') {
            detail = 'Request timed out after 6.5s. Is the local service / container running?';
          } else if (err.message && err.message.includes('Failed to fetch')) {
            detail = 'Failed to fetch. 1) In Sitecore.Services.Client.config ensure <origin>*</origin> tag is used. 2) Open endpoint in new tab to trust self-signed certificate.';
          }

          setConnectionStatus({
            state: 'failed',
            message: `Connection Failed (${err.name || 'NetworkError'})`,
            detail: detail,
            code: 'FETCH_ERROR',
            latency: `${duration}ms`,
            testedUrl: targetEnv.endpoint,
            timestamp: new Date().toLocaleTimeString()
          });
        } finally {
          setIsTestingConn(false);
        }
      };

      // --- Execute Live Query ---
      const executeLiveQuery = async () => {
        setIsQueryRunning(true);
        const startTime = performance.now();
        const isRest = queryMode === 'layout-rest' || currentEnv.type === 'rest';

        try {
          let url = currentEnv.endpoint;
          let options = {
            mode: 'cors',
            headers: {}
          };

          if (isRest) {
            url = buildRestLayoutUrl(currentEnv, selectedRoute);
            options.method = 'GET';
            options.headers['Accept'] = 'application/json';
            if (currentEnv.authToken) options.headers['Authorization'] = currentEnv.authToken;
          } else {
            if (currentEnv.apiKey) {
              const sep = url.includes('?') ? '&' : '?';
              url = `${url}${sep}sc_apikey=${encodeURIComponent(currentEnv.apiKey)}`;
            }
            options.method = 'POST';
            options.headers['Content-Type'] = 'application/json';
            if (currentEnv.apiKey) {
              options.headers['sc_apikey'] = currentEnv.apiKey;
            }
            if (currentEnv.authToken) options.headers['Authorization'] = currentEnv.authToken;

            let query = '';
            let variables = {};

            if (queryMode === 'custom' && customGraphqlText.trim()) {
              query = customGraphqlText;
            } else if (queryMode === 'item') {
              query = `query GetItemMetadata($path: String!) {
  item(path: $path) {
    id
    name
    path
    template { name id }
    finalLayout: field(name: "__Final Renderings") { value }
  }
}`;
              variables = { path: currentPage.itemId };
            } else {
              query = `query GetLayoutServiceData($site: String!, $route: String!, $lang: String!) {
  layout(site: $site, routePath: $route, language: $lang) {
    item {
      id
      name
      rendered
    }
  }
}`;
              variables = {
                site: currentEnv.siteName || 'mysite',
                route: selectedRoute,
                lang: currentEnv.language || 'en'
              };
            }

            options.body = JSON.stringify({ query, variables });
          }

          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), 10000);
          options.signal = controller.signal;

          const res = await fetch(url, options);
          clearTimeout(timeoutId);
          const duration = Math.round(performance.now() - startTime);

          const statusInfo = {
            status: res.status,
            statusText: res.statusText,
            ok: res.ok,
            duration: `${duration}ms`,
            url: url,
            timestamp: new Date().toLocaleTimeString()
          };

          let data = null;
          try {
            data = await res.json();
            statusInfo.isJson = true;
            statusInfo.body = data;
          } catch {
            const txt = await res.text();
            statusInfo.isJson = false;
            statusInfo.body = txt;
          }

          setLiveRawResult(statusInfo);

          if (res.ok && data) {
            setLiveLayoutData(data);
            setDataSourceMode('live');
            showToast(`Received layout data in ${duration}ms!`);
            setConnectionStatus({
              state: 'connected',
              message: `Live Layout Service online (${res.status} OK)`,
              detail: `Last query succeeded in ${duration}ms`,
              code: res.status,
              latency: `${duration}ms`,
              testedUrl: url,
              timestamp: new Date().toLocaleTimeString()
            });
          } else {
            showToast(`Server returned ${res.status}`);
          }
        } catch (err) {
          const duration = Math.round(performance.now() - startTime);
          setLiveRawResult({
            status: 'FETCH_ERROR',
            statusText: err.message || 'Failed to fetch',
            ok: false,
            duration: `${duration}ms`,
            url: currentEnv.endpoint,
            body: {
              error: err.name || 'NetworkError',
              message: err.message,
              troubleshooting: '1) Open Settings and remove dummy Bearer token. 2) Open endpoint URL in browser to trust self-signed SSL cert.'
            },
            isJson: true,
            timestamp: new Date().toLocaleTimeString()
          });
          showToast(`Query failed: ${err.message}`);
        } finally {
          setIsQueryRunning(false);
        }
      };

      // --- Fallback Mock Response Object ---
      const mockLayoutResponse = useMemo(() => ({
        data: {
          layout: {
            item: {

                  route: { name: currentPage.name, placeholders: currentPage.layout.placeholders }

          if (gqlPh) return gqlPh;

        setAddCompForm({
          targetRoute: initialRoute,
          newRouteName: '',
          componentId: comp.id,
          placeholder: initialPlaceholder || comp.allowedPlaceholders[0]?.key || 'headless-main',
          dataSourceName: autoDsName,
          dataSourceGuid: generateGuid(),
          dataSourcePath: autoDsPath,
          params: initialParams,
          position: 'bottom'

        setAddComponentModalOpen(true);

      // --- Execute Adding Component to Page ---
      const handleCommitAddComponent = () => {
        const targetRoute = (addCompForm.targetRoute === '__NEW__' ? addCompForm.newRouteName.trim() : addCompForm.targetRoute) || '/';
        const formattedRoute = targetRoute.startsWith('/') ? targetRoute : `/${targetRoute}`;

        const compSpec = COMPONENT_SPECS.find(c => c.id === addCompForm.componentId) || COMPONENT_SPECS[0];
        const newUid = 'r_' + Math.random().toString(36).substring(2, 8);

        const newRendering = {
          uid: newUid,
          componentName: compSpec.name,
          dataSource: addCompForm.dataSourceGuid,
          dataSourcePath: addCompForm.dataSourcePath,
          params: { ...addCompForm.params },
          hasPersonalization: false
        };

        const existingPage = pagesData[formattedRoute] || {
          name: formattedRoute === '/' ? 'Home' : formattedRoute.replace('/', '').replace(/-/g, ' '),
          template: 'Standard Content Route',
          itemId: generateGuid(),
          layout: { placeholders: {} },
          personalizations: []
        };

        const targetPh = addCompForm.placeholder || 'headless-main';
        const existingList = existingPage.layout.placeholders[targetPh] || [];

        const updatedList = addCompForm.position === 'top'
          ? [newRendering, ...existingList]
          : [...existingList, newRendering];

        const updatedPages = {
          ...pagesData,
          [formattedRoute]: {
            ...existingPage,
            layout: {
              ...existingPage.layout,
              placeholders: {
                ...existingPage.layout.placeholders,
                [targetPh]: updatedList
              }
            }
          }
        };

        savePagesData(updatedPages);
        setSelectedRoute(formattedRoute);
        setInspectingComponentUid(newUid);
        setActiveTab('layout');
        setDataSourceMode('mock');
        setAddComponentModalOpen(false);
        showToast(`Added ${compSpec.name} to ${formattedRoute} (ph: ${targetPh})!`);
      };

      // --- Remove Component from Page ---
      const handleRemoveComponent = (phKey, uid) => {
        if (!confirm('Are you sure you want to remove this component from the page layout?')) return;
        const currentList = currentPage.layout.placeholders[phKey] || [];
        const updatedList = currentList.filter(c => c.uid !== uid);

        const updatedPages = {
          ...pagesData,
          [selectedRoute]: {
            ...currentPage,
            layout: {
              ...currentPage.layout,
              placeholders: {
                ...currentPage.layout.placeholders,
                [phKey]: updatedList
              }
            }
          }
        };

        savePagesData(updatedPages);
        showToast('Component removed from layout');

      // --- Reorder Component in Slot ---

        const currentList = [...(currentPage.layout.placeholders[phKey] || [])];
        const newIndex = direction === 'up' ? index - 1 : index + 1;

            ...currentPage,
            layout: {
              ...currentPage.layout,
              placeholders: {
                ...currentPage.layout.placeholders,
                [phKey]: currentList

            }

        savePagesData(updatedPages);

                        })()}
                        <option value="col-left">col-left (Two-Column Left)</option>
                        <option value="col-right">col-right (Two-Column Right)</option>
                        <option value="headless-footer">headless-footer (Footer Slot)</option>
                      </select>
                    </div>
                  </div>

                  {/* Datasource Configuration */}
                  <div className="p-3 bg-slate-950 rounded-xl border border-slate-800 space-y-2">
                    <div className="flex items-center justify-between">
                      <label className="text-slate-300 font-semibold">Datasource Configuration</label>
                      <button
                        onClick={() => setAddCompForm(f => ({ ...f, dataSourceGuid: generateGuid() }))}
                        className="text-[10px] text-indigo-400 hover:text-indigo-300 font-mono"
                      >
                        Regenerate GUID
                      </button>
                    </div>
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 font-mono">
                      <div>
                        <span className="text-slate-500 text-[10px]">GUID:</span>
                        <input
                          type="text"
                          value={addCompForm.dataSourceGuid}
                          onChange={(e) => setAddCompForm(f => ({ ...f, dataSourceGuid: e.target.value }))}
                          className="w-full bg-slate-900 border border-slate-800 rounded px-2 py-1 text-slate-300 text-[11px]"
                        />
                      </div>
                      <div>
                        <span className="text-slate-500 text-[10px]">Path:</span>
                        <input
                          type="text"
                          value={addCompForm.dataSourcePath}
                          onChange={(e) => setAddCompForm(f => ({ ...f, dataSourcePath: e.target.value }))}
                          className="w-full bg-slate-900 border border-slate-800 rounded px-2 py-1 text-slate-300 text-[11px]"
                        />
                      </div>
                    </div>
                  </div>

                  {/* Rendering Parameters Selection */}
                  {(() => {
                    const comp = COMPONENT_SPECS.find(c => c.id === addCompForm.componentId) || COMPONENT_SPECS[0];
                    if (!comp.renderingParams || comp.renderingParams.length === 0) return null;
                    return (
                      <div className="p-3 bg-slate-950 rounded-xl border border-slate-800 space-y-2">
                        <label className="text-slate-300 font-semibold block">Rendering Parameters</label>
                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                          {comp.renderingParams.map(rp => (
                            <div key={rp.param}>
                              <span className="text-slate-400 text-[11px] block mb-0.5">{rp.param}</span>
                              <select
                                value={addCompForm.params[rp.param] || rp.default}
                                onChange={(e) => {
                                  const val = e.target.value;
                                  setAddCompForm(f => ({
                                    ...f,
                                    params: { ...f.params, [rp.param]: val }
                                  }));
                                }}
                                className="w-full bg-slate-900 border border-slate-800 rounded px-2 py-1 text-slate-200 text-xs"
                              >
                                {rp.options.map(opt => (
                                  <option key={opt} value={opt}>{opt}</option>
                                ))}
                              </select>
                            </div>
                          ))}
                        </div>
                      </div>
                    );
                  })()}
                </div>

                {/* Modal Footer */}
                <div className="flex items-center justify-between pt-3 border-t border-slate-800">
                  <button
                    onClick={() => {
                      const snippet = JSON.stringify({
                        componentName: addCompForm.componentId,
                        placeholder: addCompForm.placeholder,
                        dataSource: addCompForm.dataSourceGuid,
                        dataSourcePath: addCompForm.dataSourcePath,
                        params: addCompForm.params
                      }, null, 2);
                      copyToClipboard(snippet, 'Layout Service Rendering snippet');
                    }}
                    className="text-xs text-slate-400 hover:text-white flex items-center gap-1"
                  >
                    <Icon name="copy" className="w-3.5 h-3.5" /> Copy JSON
                  </button>

                  <div className="flex gap-2">
                    <button
                      onClick={() => setAddComponentModalOpen(false)}
                      className="px-3 py-1.5 text-xs text-slate-400 hover:text-white"
                    >
                      Cancel
                    </button>
                    <button
                      onClick={handleCommitAddComponent}
                      className="px-4 py-2 bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white rounded-lg text-xs font-bold shadow-lg shadow-indigo-600/30 active:scale-95 transition-all flex items-center gap-1.5"
                    >
                      <Icon name="plus" className="w-4 h-4" />
                      Insert into Page Layout
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* DIAGNOSTICS & TROUBLESHOOTING MODAL */}
          {diagModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm">
              <div className="bg-slate-900 border border-slate-800 rounded-2xl max-w-2xl w-full p-6 space-y-5 shadow-2xl max-h-[90vh] overflow-y-auto">
                <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                  <h3 className="text-base font-bold text-white flex items-center gap-2">
                    <Icon name="alertTriangle" className="w-5 h-5 text-amber-400" />
                    Local Layout Service Diagnostics & Troubleshooting
                  </h3>
                  <button onClick={() => setDiagModalOpen(false)} className="text-slate-400 hover:text-white">
                    <Icon name="x" className="w-5 h-5" />
                  </button>
                </div>

                <div className="bg-slate-950 p-4 rounded-xl border border-slate-800 space-y-2 text-xs">
                  <div className="flex items-center justify-between">
                    <span className="font-bold text-slate-300">Current Test Result:</span>
                    <span className={`px-2 py-0.5 rounded font-mono font-bold ${
                      connectionStatus.state === 'connected' ? 'bg-emerald-500/20 text-emerald-400' : 'bg-rose-500/20 text-rose-400'
                    }`}>
                      {connectionStatus.state.toUpperCase()} {connectionStatus.code ? `(HTTP ${connectionStatus.code})` : ''}
                    </span>
                  </div>
                  <div className="text-slate-400 font-mono text-[11px] break-all">
                    URL: {connectionStatus.testedUrl || currentEnv.endpoint}
                  </div>
                  {connectionStatus.detail && (
                    <div className="text-amber-300 bg-amber-950/30 p-2.5 rounded border border-amber-500/30 text-[11px]">
                      {connectionStatus.detail}
                    </div>
                  )}
                </div>

                <div className="space-y-3 text-xs">
                  <div className="p-3 bg-slate-950 rounded-xl border border-slate-800 space-y-1">
                    <div className="font-bold text-indigo-300">1. Remove Dummy Authorization Header</div>
                    <p className="text-slate-400 text-[11px]">If you're using an API Key, ensure the "Auth Header Token" field in Settings is empty so browser preflight doesn't get rejected.</p>
                  </div>
                  <div className="p-3 bg-slate-950 rounded-xl border border-slate-800 space-y-1">
                    <div className="font-bold text-indigo-300">2. Self-Signed SSL Certificates (`https://cm.local`)</div>
                    <p className="text-slate-400 text-[11px]">Open the endpoint directly in a new tab and click "Proceed to ... (unsafe)" to trust the certificate for this session.</p>
                  </div>
                </div>

                <div className="flex justify-end pt-3 border-t border-slate-800">
                  <button
                    onClick={() => {
                      setDiagModalOpen(false);
                      testConnection(currentEnv);
                    }}
                    className="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-xs font-semibold"
                  >
                    Re-Test Connection Now
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* SETTINGS MODAL */}
          {settingsOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm">
              <div className="bg-slate-900 border border-slate-800 rounded-2xl max-w-xl w-full p-5 space-y-4 shadow-2xl max-h-[90vh] overflow-y-auto">
                <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                  <h3 className="text-sm font-bold text-white flex items-center gap-2">
                    <Icon name="settings" className="w-4 h-4 text-indigo-400" />
                    Configure Layout Service Environments
                  </h3>
                  <button onClick={() => setSettingsOpen(false)} className="text-slate-400 hover:text-white">
                    <Icon name="x" className="w-4 h-4" />
                  </button>
                </div>

                <div className="space-y-3 text-xs">
                  <div>
                    <label className="text-slate-400 block mb-1 font-semibold">Active Preset</label>
                    <div className="grid grid-cols-2 sm:grid-cols-3 gap-2">
                      {environments.map(e => (
                        <button
                          key={e.id}
                          onClick={() => setActiveEnvId(e.id)}
                          className={`p-2 rounded-lg border text-left text-xs font-semibold ${
                            activeEnvId === e.id
                              ? `${e.color} border-current`
                              : 'bg-slate-950 border-slate-800 text-slate-400 hover:text-white'
                          }`}
                        >
                          <div className="truncate">{e.name}</div>
                          <div className="text-[10px] font-mono opacity-80 uppercase">{e.type || 'graphql'}</div>
                        </button>
                      ))}
                    </div>
                  </div>

                  <div className="pt-2 border-t border-slate-800 space-y-3">
                    <div>
                      <label className="text-slate-400 block mb-1">Layout Service / GraphQL URL</label>
                      <input
                        type="text"
                        value={currentEnv.endpoint}
                        onChange={(e) => {
                          const val = e.target.value;
                          setEnvironments(prev => prev.map(env => env.id === currentEnv.id ? { ...env, endpoint: val } : env));
                        }}
                        className="w-full bg-slate-950 border border-slate-800 rounded px-2.5 py-1.5 text-slate-200 font-mono text-xs"
                      />
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                      <div>
                        <label className="text-slate-400 block mb-1">Sitecore API Key</label>
                        <input
                          type="text"
                          value={currentEnv.apiKey || ''}
                          onChange={(e) => {
                            const val = e.target.value;
                            setEnvironments(prev => prev.map(env => env.id === currentEnv.id ? { ...env, apiKey: val } : env));
                          }}
                          className="w-full bg-slate-950 border border-slate-800 rounded px-2.5 py-1.5 text-slate-200 font-mono text-xs"
                        />
                      </div>
                      <div>
                        <label className="text-slate-400 block mb-1">Site Name (sc_site)</label>
                        <input
                          type="text"
                          value={currentEnv.siteName || ''}
                          onChange={(e) => {
                            const val = e.target.value;
                            setEnvironments(prev => prev.map(env => env.id === currentEnv.id ? { ...env, siteName: val } : env));
                          }}
                          className="w-full bg-slate-950 border border-slate-800 rounded px-2.5 py-1.5 text-slate-200 text-xs"
                        />
                      </div>
                      <div>
                        <label className="text-slate-400 block mb-1">Language (sc_lang)</label>
                        <input
                          type="text"
                          value={currentEnv.language || 'en'}
                          onChange={(e) => {
                            const val = e.target.value;
                            setEnvironments(prev => prev.map(env => env.id === currentEnv.id ? { ...env, language: val } : env));
                          }}
                          className="w-full bg-slate-950 border border-slate-800 rounded px-2.5 py-1.5 text-slate-200 text-xs"
                        />
                      </div>
                    </div>

                    <div>
                      <label className="text-slate-400 block mb-1">Auth Header Token (Leave empty if using API key)</label>
                      <input
                        type="text"
                        value={currentEnv.authToken || ''}
                        placeholder="Bearer token (leave empty if using API Key)"
                        onChange={(e) => {
                          const val = e.target.value;
                          setEnvironments(prev => prev.map(env => env.id === currentEnv.id ? { ...env, authToken: val } : env));
                        }}
                        className="w-full bg-slate-950 border border-slate-800 rounded px-2.5 py-1.5 text-slate-200 font-mono text-xs"
                      />
                    </div>
                  </div>
                </div>

                <div className="flex items-center justify-between pt-3 border-t border-slate-800">
                  <button
                    onClick={() => {
                      setEnvironments(DEFAULT_ENVIRONMENTS);
                      setPagesData(DEFAULT_PAGES_DATABASE);
                      localStorage.removeItem('sitecore_compass_envs');
                      localStorage.removeItem('sitecore_compass_pages');
                      showToast('Reset environments and pages to defaults');
                    }}
                    className="text-xs text-rose-400 hover:text-rose-300"
                  >
                    Reset All to Defaults
                  </button>

                  <div className="flex gap-2">
                    <button onClick={() => setSettingsOpen(false)} className="px-3 py-1.5 text-xs text-slate-400 hover:text-white">
                      Close
                    </button>
                    <button
                      onClick={() => {
                        localStorage.setItem('sitecore_compass_envs', JSON.stringify(environments));
                        setSettingsOpen(false);
                        showToast('Saved settings');
                      }}
                      className="px-4 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-xs font-semibold"
                    >
                      Save Changes
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // Render directly to DOM
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
