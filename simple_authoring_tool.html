'import {\n' +

fieldTypes + '\n' +

'      <div className="bg-slate-900 border border-slate-800 rounded-3xl p-8 shadow-2xl space-y-4">\n' +
'        {/* Inline Experience Editor Editable Fields */}\n' +
fieldRenderers +
childPhBlock + '\n' +

'    </section>\n' +

    };

    const generateScsYaml = (comp) => {

    const generateSpeScript = (comp) => {

'# Sitecore PowerShell Extensions (SPE) 1-Click Component Scaffolder\n' +

'$componentName = "' + comp.name + '"\n' +
'$category = "' + comp.category + '"\n' +
'$allowedPlaceholders = "' + allowedPhs + '"\n\n' +

'$securityDisabler = New-Object Sitecore.SecurityModel.SecurityDisabler\n\n' +
'# Recursive Sitecore folder hierarchy creator\n' +
'function Ensure-SitecoreFolder {\n' +
'    param(\n' +
'        [string]$Path,\n' +
'        [string]$TemplatePath\n' +
'    )\n' +
'    $cleanPath = $Path -replace "^master:", ""\n' +
'    $parts = $cleanPath.Trim("/").Split("/")\n' +
'    $current = "master:/sitecore"\n' +
'    $startIndex = if ($parts[0] -eq "sitecore") { 1 } else { 0 }\n\n' +
'    for ($i = $startIndex; $i -lt $parts.Length; $i++) {\n' +
'        $part = $parts[$i]\n' +
'        if ([string]::IsNullOrWhiteSpace($part)) { continue }\n' +
'        $current = "$current/$part"\n' +
'        if (-not (Test-Path -Path $current)) {\n' +
'            New-Item -Path $current -ItemType $TemplatePath -Force | Out-Null\n' +
'            Write-Host "Created folder: $current" -ForegroundColor DarkGray\n' +

'    }\n' +
'    return Get-Item -Path $current\n' +
'}\n\n' +
'# 1. Ensure Target Template & Rendering Parent Folders Exist\n' +
'$templateParent = Ensure-SitecoreFolder -Path "/sitecore/templates/Project/Components/$category" -TemplatePath "/sitecore/templates/System/Templates/Template Folder"\n' +

'$templatePath = "$($templateParent.Paths.FullPath)/$componentName"\n' +
'$templateItem = if (Test-Path -Path "master:$templatePath") { Get-Item -Path "master:$templatePath" } else { New-Item -Path "master:$templatePath" -ItemType "/sitecore/templates/System/Templates/Template" -Force }\n\n' +
'# 3. Create or Get Template Section ("Data")\n' +
'$sectionPath = "$templatePath/Data"\n' +
'$sectionItem = if (Test-Path -Path "master:$sectionPath") { Get-Item -Path "master:$sectionPath" } else { New-Item -Path "master:$sectionPath" -ItemType "/sitecore/templates/System/Templates/Template section" -Force }\n\n' +
'# 4. Create Template Fields\n' +
fieldCreationLines + '\n\n' +
'# 5. Resolve JSON Rendering Template (Checks JSS, Headless, SXA & Standard Renderings)\n' +
'$renderingTplPath = "/sitecore/templates/System/Layout/Renderings/Json Rendering"\n' +
'if (-not (Test-Path -Path "master:$renderingTplPath")) {\n' +
'    $renderingTplPath = "/sitecore/templates/Foundation/JavaScript Services/Json Rendering"\n' +
'}\n' +
'if (-not (Test-Path -Path "master:$renderingTplPath")) {\n' +
'    $renderingTplPath = "/sitecore/templates/Foundation/Experience Accelerator/Rendering/Json Rendering"\n' +
'}\n\n' +
'# 6. Create or Get JSON Rendering Item\n' +
'$renderingPath = "$($renderingParent.Paths.FullPath)/$componentName"\n' +
'$renderingItem = if (Test-Path -Path "master:$renderingPath") { Get-Item -Path "master:$renderingPath" } else { New-Item -Path "master:$renderingPath" -ItemType $renderingTplPath -Force }\n\n' +
'$renderingItem.Editing.BeginEdit()\n' +

    // --- MARKDOWN DOCUMENT GENERATOR (Audience Specific: Authors, Developers, Both) ---
    const generateMarkdownDocs = (components, audience = 'both') => {
      const isAuthor = audience === 'author' || audience === 'both';

      md += '**Target Audience:** ' + audienceLabel + '  \n';
      md += '**Generated At:** ' + new Date().toLocaleDateString() + '  \n';
      md += '**Architecture:** Sitecore 10.4 SXA Headless with Next.js (SSG/ISR)\n\n';
      md += '---\n\n';

      components.forEach((comp, idx) => {
        md += '## ' + (idx + 1) + '. ' + comp.name + '\n\n';
        md += '**Category:** `' + comp.category + '` | **SXA Module:** `' + (comp.sxaModule || 'Composables') + '`\n\n';
        md += '> ' + comp.description + '\n\n';

        // Placement & Placeholders
        md += '### 📍 Placement & Placeholders (Bi-Directional)\n\n';
        md += '- **Allowed Page Placeholders (Parent):** ' + ((comp.allowedPlaceholders || []).map(p => '`' + p.key + '`').join(', ') || '`headless-main`') + '\n';
        if (comp.childPlaceholder?.enabled) {
          md += '- **Inner Child Slot:** `Placeholder: ' + comp.childPlaceholder.name + '` *(Accepts nested components inside this container)*\n';
        } else {
          md += '- **Inner Child Slot:** *None (Atomic Component)*\n';

        md += '\n';

        // Content Authoring Guidelines Section
        if (isAuthor) {
          md += '### ✍️ Content Authoring Guidelines\n\n';
          md += '#### Field Specification Table\n\n';
          md += '| Field Name | Field Type | Limit / Recommendation | Required | Authoring Purpose & Instructions |\n';
          md += '| :--- | :--- | :--- | :---: | :--- |\n';
          comp.fields.forEach(f => {
            md += '| **' + f.name + '** | `' + f.type + '` | ' + (f.limit || 'Standard') + ' | ' + (f.required ? '✅ Yes' : 'No') + ' | ' + (f.description || 'Editable content') + ' |\n';
          });
          md += '\n';

          if (comp.renderingParams && comp.renderingParams.length > 0) {
            md += '#### 🎨 Rendering Parameters (Visual Variations)\n\n';
            comp.renderingParams.forEach(rp => {
              md += '- **' + rp.param + ':** Available options: `' + rp.options.join('`, `') + '` *(Default: `' + rp.default + '`)*\n';
            });
            md += '\n';
          }

          md += '#### 💡 Authoring Best Practices\n';
          md += '- **Datasource Storage:** Save items under `' + (comp.datasourceTemplate?.defaultLocationQuery || './_Data/' + comp.name + 's') + '`.\n';
          md += '- **Experience Editor:** All headline, rich text, image, and link fields can be edited directly inline on the page canvas.\n';
          md += '- **Workflow & Publishing:** Always approve datasources and the associated page item before publishing to production.\n\n';
        }

        // Developer & Technical Section
        if (isDev) {
          md += '### 💻 Developer Specifications\n\n';
          md += '- **Sitecore Data Template:** `' + (comp.datasourceTemplate?.path || '/sitecore/templates/Project/Components/' + comp.name) + '`\n';
          md += '- **Next.js Component File:** `src/components/' + comp.name + '.tsx`\n';
          md += '- **Layout Service Model:** JSS REST / GraphQL Edge schema\n\n';

          md += '#### TypeScript Props Contract\n\n```typescript\n';
          md += 'export interface ' + comp.name + 'Fields {\n';
          comp.fields.forEach(f => {
            const vName = f.name.charAt(0).toLowerCase() + f.name.slice(1);
            md += '  ' + vName + '?: ' + getFieldTsType(f.type) + '; // ' + f.type + (f.required ? ' (Required)' : '') + '\n';
          });
          md += '}\n```\n\n';
        }

        md += '---\n\n';
      });

      return md;
    };

    // =========================================================================
    // MAIN APP COMPONENT
    // =========================================================================
    function App() {

      const [componentSpecs, setComponentSpecs] = useState(() => {

      const [environments, setEnvironments] = useState(() => {

      const [activeEnvId, setActiveEnvId] = useState('sc-xm-rest');

      const [syncModalOpen, setSyncModalOpen] = useState(false);
      const [toastMessage, setToastMessage] = useState(null);

      // Documentation Generator State
      const [docAudience, setDocAudience] = useState('author'); // 'author' | 'dev' | 'both'
      const [docScope, setDocScope] = useState('all'); // 'all' | 'single'
      const [docSelectedCompId, setDocSelectedCompId] = useState('HeroBanner');

      // Sitecore Import / Harvest State
      const [syncRoutePath, setSyncRoutePath] = useState('/about-us');
      const [syncIsScanning, setSyncIsScanning] = useState(false);
      const [syncPastedJson, setSyncPastedJson] = useState('');
      const [syncDiscoveredComponents, setSyncDiscoveredComponents] = useState([]);
      const [syncSelectedToImport, setSyncSelectedToImport] = useState({});
      const [syncTabMode, setSyncTabMode] = useState('live'); // 'live' | 'paste'

      const [syncScanStatus, setSyncScanStatus] = useState({

      });

      const [selectedRoute, setSelectedRoute] = useState('/');

          { id: 'f2', name: 'Description', type: 'Rich Text', limit: '200 chars', required: false, description: 'Offer details and terms', mockValue: '<p>Get 20% off all enterprise headless deployments this quarter.</p>' },
          { id: 'f3', name: 'ActionLink', type: 'General Link', limit: 'Single CTA', required: true, description: 'CTA destination', mockValue: 'https://sitecore.com|Claim Offer' },
          { id: 'f4', name: 'BannerImage', type: 'Image', limit: '1200 × 600 px', required: true, description: 'Promo banner visual', mockValue: 'https://images.unsplash.com/photo-1551288049-bebda4e38f71?w=800&q=80' }
        ],

      const currentEnv = useMemo(() => {

      const activeComponent = useMemo(() => {

      const showToast = (msg) => {

      const copyToClipboard = (text, label) => {

      };

      const downloadFile = (filename, text) => {
        const element = document.createElement('a');
        element.setAttribute('href', 'data:text/plain;charset=utf-8,' + encodeURIComponent(text));
        element.setAttribute('download', filename);
        element.style.display = 'none';
        document.body.appendChild(element);
        element.click();
        document.body.removeChild(element);
        showToast('Downloaded ' + filename);
      };

      // Save Component Specs to localStorage
      const persistComponentSpecs = (updated) => {
        setComponentSpecs(updated);
        try {
          localStorage.setItem('sitecore_compass_custom_specs', JSON.stringify(updated));
        } catch(e) {}
      };

      // Test Connection (Simple GET request)
      const testConnection = async (targetEnv = currentEnv) => {
        setIsTestingConn(true);
        setConnectionStatus({ state: 'testing', latency: null });
        const start = performance.now();
        try {
          let url = targetEnv.endpoint;
          let opts = { mode: 'cors', headers: { 'Accept': 'application/json' } };
          const sep = url.includes('?') ? '&' : '?';
          url = url + sep + 'item=' + encodeURIComponent(selectedRoute) + '&sc_apikey=' + encodeURIComponent(targetEnv.apiKey) + '&sc_site=' + encodeURIComponent(targetEnv.siteName || 'mysite') + '&sc_lang=' + encodeURIComponent(targetEnv.language || 'en');
          opts.method = 'GET';

          const controller = new AbortController();
          const tId = setTimeout(() => controller.abort(), 6000);
          opts.signal = controller.signal;

          const res = await fetch(url, opts);
          clearTimeout(tId);
          const dur = Math.round(performance.now() - start);

          if (res.ok) {
            setConnectionStatus({ state: 'connected', latency: dur + 'ms' });
            showToast('Connected to Sitecore Layout Service (' + dur + 'ms)!');
          } else {
            setConnectionStatus({ state: 'error', latency: dur + 'ms' });
            showToast('Endpoint responded with HTTP ' + res.status);
          }
        } catch (err) {
          setConnectionStatus({ state: 'error', latency: null });
          showToast('Failed to connect. Check CORS or API Key.');
        } finally {
          setIsTestingConn(false);
        }
      };

      // =========================================================================
      // SITECORE COMPONENT PARSER & HARVEST ENGINE
      // =========================================================================
      const parseLayoutServiceJsonTree = (data) => {
        const foundCompsMap = {};

        // Helper to recursively inspect placeholders
        const inspectPlaceholders = (placeholdersObj) => {
          if (!placeholdersObj || typeof placeholdersObj !== 'object') return;
          
          Object.entries(placeholdersObj).forEach(([phKey, compList]) => {
            if (!Array.isArray(compList)) return;

            compList.forEach(compInstance => {
              const name = compInstance.componentName || compInstance.renderingName || 'UnnamedComponent';
              if (name === 'UnnamedComponent' || name.startsWith('sitecore-')) return;

              if (!foundCompsMap[name]) {
                // Infer fields
                const rawFields = compInstance.fields || {};
                const fieldsList = Object.entries(rawFields).map(([fKey, fVal], fIdx) => {
                  const fType = inferFieldType(fVal);
                  let mock = '';
                  if (typeof fVal === 'object' && fVal !== null) {
                    mock = fVal.value !== undefined ? String(fVal.value) : (fVal.src || fVal.href || '');
                  } else {
                    mock = String(fVal || '');
                  }
                  return {
                    id: 'f_' + (fIdx + 1),
                    name: fKey.charAt(0).toUpperCase() + fKey.slice(1),
                    type: fType,
                    limit: fType === 'Image' ? '1200 × 600 px' : 'Standard',
                    required: true,
                    description: 'Imported from Sitecore field `' + fKey + '`',
                    mockValue: mock
                  };
                });

                // Infer rendering params
                const rawParams = compInstance.params || {};
                const rParamsList = Object.entries(rawParams).map(([pKey, pVal], pIdx) => ({
                  id: 'p_' + (pIdx + 1),
                  param: pKey,
                  options: [String(pVal), 'Alternative Option'],
                  default: String(pVal)
                }));

                // Check child placeholders
                const childPhs = compInstance.placeholders ? Object.keys(compInstance.placeholders) : [];
                const hasChildPh = childPhs.length > 0;

                foundCompsMap[name] = {
                  id: name,
                  name: name,
                  category: 'Imported Renderings',
                  sxaModule: 'Sitecore CM',
                  description: 'Existing component harvested from Sitecore CM Layout Service on route `' + (syncRoutePath || '/') + '`.',
                  datasourceTemplate: {
                    path: '/sitecore/templates/Project/Components/' + name,
                    defaultLocationQuery: compInstance.dataSourcePath || './_Data/' + name + 's'
                  },
                  allowedPlaceholders: [{ key: phKey, scope: 'Body', note: 'Discovered in ' + phKey }],
                  childPlaceholder: {
                    enabled: hasChildPh,
                    name: hasChildPh ? childPhs[0] : ''
                  },
                  fields: fieldsList.length > 0 ? fieldsList : [
                    { id: 'f1', name: 'Title', type: 'Single-Line Text', limit: '50 chars', required: true, description: 'Primary field', mockValue: 'Sample title' }
                  ],
                  renderingParams: rParamsList
                };
              } else {
                // Add placeholder if not present
                if (!foundCompsMap[name].allowedPlaceholders.some(p => p.key === phKey)) {
                  foundCompsMap[name].allowedPlaceholders.push({ key: phKey, scope: 'Body', note: 'Discovered in ' + phKey });
                }
              }

              // Recursively inspect inner child placeholders
              if (compInstance.placeholders) {
                inspectPlaceholders(compInstance.placeholders);
              }
            });
          });
        };

        const rootPlaceholders = data?.sitecore?.route?.placeholders || data?.placeholders || (data?.layout?.placeholders) || {};
        inspectPlaceholders(rootPlaceholders);

        const list = Object.values(foundCompsMap);
        setSyncDiscoveredComponents(list);
        
        const initialSelected = {};
        list.forEach(c => { initialSelected[c.id] = true; });
        setSyncSelectedToImport(initialSelected);

        return list;
      };

      // Perform Live Route Scan from Sitecore CM with Full Diagnostic Feedback
      const handleScanSitecoreRoute = async () => {
        setSyncIsScanning(true);
        setSyncDiscoveredComponents([]);
        
        let constructedUrl = currentEnv.endpoint || '';
        const sep = constructedUrl.includes('?') ? '&' : '?';
        constructedUrl = constructedUrl + sep + 
          'item=' + encodeURIComponent(syncRoutePath || '/') + 
          '&sc_apikey=' + encodeURIComponent(currentEnv.apiKey || '') + 
          '&sc_site=' + encodeURIComponent(currentEnv.siteName || 'mysite') + 
          '&sc_lang=' + encodeURIComponent(currentEnv.language || 'en');

        setSyncScanStatus({
          state: 'scanning',
          message: 'Connecting to Sitecore Layout Service at ' + currentEnv.endpoint + '...',
          statusCode: null,
          fullRequestUrl: constructedUrl,
          rawResponseText: '',
          discoveredCount: 0
        });

        try {
          const controller = new AbortController();
          const tId = setTimeout(() => controller.abort(), 8000);
          
          const res = await fetch(constructedUrl, {
            method: 'GET',
            mode: 'cors',
            headers: { 'Accept': 'application/json' },
            signal: controller.signal
          });
          clearTimeout(tId);

          const status = res.status;
          const text = await res.text();

          if (!res.ok) {
            setSyncScanStatus({
              state: 'error',
              message: 'Sitecore CM returned HTTP ' + status + ' (' + res.statusText + '). Verify your API Key, Route, or Site Name.',
              statusCode: status,
              fullRequestUrl: constructedUrl,
              rawResponseText: text.substring(0, 1500),
              discoveredCount: 0
            });
            showToast('HTTP ' + status + ' error from Sitecore');
            return;
          }

          let data;
          try {
            data = JSON.parse(text);
          } catch(e) {
            setSyncScanStatus({
              state: 'error',
              message: 'Response is not valid JSON. Endpoint may have returned an HTML error or login page.',
              statusCode: status,
              fullRequestUrl: constructedUrl,
              rawResponseText: text.substring(0, 1500),
              discoveredCount: 0
            });
            showToast('Response was not valid JSON');
            return;
          }

          const discovered = parseLayoutServiceJsonTree(data);
          
          if (discovered.length === 0) {
            setSyncScanStatus({
              state: 'success',
              message: 'Connected successfully (HTTP 200), but found 0 components in placeholders for route "' + syncRoutePath + '". Ensure components are bound to this page in Experience Editor.',
              statusCode: 200,
              fullRequestUrl: constructedUrl,
              rawResponseText: JSON.stringify(data, null, 2).substring(0, 1500),
              discoveredCount: 0
            });
            showToast('0 components found on route ' + syncRoutePath);
          } else {
            setSyncScanStatus({
              state: 'success',
              message: 'Success! Discovered ' + discovered.length + ' component(s) on route "' + syncRoutePath + '".',
              statusCode: 200,
              fullRequestUrl: constructedUrl,
              rawResponseText: JSON.stringify(data, null, 2).substring(0, 1500),
              discoveredCount: discovered.length
            });
            showToast('Discovered ' + discovered.length + ' component(s)!');
          }
        } catch (err) {
          const isAbort = err.name === 'AbortError';
          const errMsg = isAbort 
            ? 'Request timed out after 8 seconds. CM container might be slow, warming up, or unreachable.' 
            : err.message || 'Failed to fetch';

          setSyncScanStatus({
            state: 'error',
            message: errMsg + '. This typically happens when the browser blocks the local domain, the SSL certificate is self-signed/untrusted, or CORS is restricted.',
            statusCode: null,
            fullRequestUrl: constructedUrl,
            rawResponseText: '',
            discoveredCount: 0
          });
          showToast('Scan failed: ' + errMsg);
        } finally {
          setSyncIsScanning(false);
        }
      };

      // Handle Parsing Pasted JSON
      const handleParsePastedJson = () => {
        if (!syncPastedJson.trim()) {
          showToast('Please paste valid Layout Service or SPE JSON');
          return;
        }
        try {
          const parsed = JSON.parse(syncPastedJson);
          const discovered = parseLayoutServiceJsonTree(parsed);
          if (discovered.length === 0) {
            setSyncScanStatus({
              state: 'error',
              message: 'Parsed JSON successfully, but could not detect any Project components in placeholders.',
              statusCode: 200,
              fullRequestUrl: '',
              rawResponseText: syncPastedJson.substring(0, 1000),
              discoveredCount: 0
            });
            showToast('Parsed JSON, but found no project components');
          } else {
            setSyncScanStatus({
              state: 'success',
              message: 'Successfully extracted ' + discovered.length + ' component(s) from pasted JSON!',
              statusCode: 200,
              fullRequestUrl: '',
              rawResponseText: syncPastedJson.substring(0, 1000),
              discoveredCount: discovered.length
            });
            showToast('Successfully extracted ' + discovered.length + ' component(s)!');
          }
        } catch (err) {
          setSyncScanStatus({
            state: 'error',
            message: 'Invalid JSON syntax: ' + err.message,
            statusCode: null,
            fullRequestUrl: '',
            rawResponseText: '',
            discoveredCount: 0
          });
          showToast('Invalid JSON syntax');
        }
      };

      // Import Discovered Components into the Catalog
      const handleExecuteImport = () => {
        const toImport = syncDiscoveredComponents.filter(c => syncSelectedToImport[c.id]);
        if (toImport.length === 0) {
          showToast('No components selected for import');
          return;

        // Merge with existing specs (update existing or append new)
        const updated = [...componentSpecs];

            updated[existingIdx] = { ...updated[existingIdx], ...item };

            updated.push(item);

        setSelectedComponentId(toImport[0].id);
        setActiveWorkspaceTab('catalog');
        setSyncModalOpen(false);
        showToast('Successfully imported ' + toImport.length + ' component(s) into Catalog!');

                                className="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg font-bold text-xs flex items-center gap-1.5 transition-all shadow"
                              >
                                <Icon name="externalLink" className="w-3.5 h-3.5" />
                                <span>Open URL in New Tab (Test / Accept SSL)</span>
                              </a>

                              <button
                                onClick={() => copyToClipboard(syncScanStatus.fullRequestUrl, 'Request URL')}
                                className="px-3 py-1.5 bg-slate-900 hover:bg-slate-800 text-slate-200 border border-slate-800 rounded-lg text-xs font-bold flex items-center gap-1"
                              >
                                <Icon name="copy" className="w-3.5 h-3.5 text-indigo-400" />
                                <span>Copy URL</span>
                              </button>
                            </div>
                          </div>
                        )}

                        {/* Troubleshooting Advice */}
                        <div className="text-[11px] text-slate-300 space-y-1 bg-slate-950/50 p-3 rounded-xl border border-slate-800/80">
                          <strong className="text-slate-200 block">💡 Quick Resolution Guide:</strong>
                          <ul className="list-disc list-inside space-y-1">
                            <li>If using <strong>https://sc.xm.cm.dev.local</strong> with a self-signed certificate, click <strong>Open URL in New Tab</strong> and choose <em>"Proceed to site (unsafe)"</em> so your browser trusts it.</li>
                            <li>If direct browser CORS is restricted, copy the JSON displayed in the new tab and switch to the <strong>📋 Paste JSON</strong> tab.</li>
                            <li>Check that the Site Name (<code>{currentEnv.siteName || 'mysite'}</code>) and API Key are valid in <strong>Settings</strong>.</li>
                          </ul>
                        </div>
                      </div>
                    )}

                    {syncScanStatus.state === 'success' && (
                      <div className="p-4 bg-emerald-950/40 border border-emerald-500/40 rounded-2xl flex items-center gap-3 text-emerald-300">
                        <Icon name="checkCircle" className="w-5 h-5 text-emerald-400 flex-shrink-0" />
                        <div>
                          <span className="font-bold block text-sm">{syncScanStatus.message}</span>
                          <span className="text-[11px] text-emerald-200/80 font-mono">Discovered {syncScanStatus.discoveredCount} component schema(s).</span>
                        </div>
                      </div>
                    )}
                  </div>
                )}

                {/* MODE B: PASTE JSON */}
                {syncTabMode === 'paste' && (
                  <div className="space-y-3 text-xs">
                    <div className="flex items-center justify-between">
                      <label className="text-slate-300 font-bold">Paste Raw Layout Service JSON or SPE Export</label>
                      <button
                        onClick={async () => {
                          try {
                            const text = await navigator.clipboard.readText();
                            setSyncPastedJson(text);
                            showToast('Pasted from clipboard!');
                          } catch(e) {
                            showToast('Could not read clipboard. Please paste manually.');
                          }
                        }}
                        className="text-cyan-400 hover:text-cyan-300 font-bold text-[11px] flex items-center gap-1"
                      >
                        <Icon name="copy" className="w-3 h-3" />
                        <span>Paste from Clipboard</span>
                      </button>
                    </div>

                    <textarea
                      rows={7}
                      value={syncPastedJson}
                      onChange={(e) => setSyncPastedJson(e.target.value)}
                      placeholder='Paste JSON output here (e.g. { "sitecore": { "route": { "placeholders": { ... } } } })'
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-white font-mono text-[11px] focus:border-cyan-500 focus:outline-none"
                    />

                    <button
                      onClick={handleParsePastedJson}
                      className="px-5 py-2.5 bg-gradient-to-r from-cyan-600 to-indigo-600 hover:from-cyan-500 text-white rounded-xl font-bold flex items-center gap-1.5 shadow-lg shadow-cyan-600/30"
                    >
                      <Icon name="sparkles" className="w-3.5 h-3.5" />
                      <span>Extract & Populate Components from JSON</span>
                    </button>

                    {syncScanStatus.state === 'error' && (
                      <div className="p-3 bg-rose-950/40 border border-rose-500/40 rounded-xl text-rose-300 text-xs">
                        ⚠️ {syncScanStatus.message}
                      </div>
                    )}
                  </div>
                )}

                {/* DISCOVERED COMPONENTS REVIEW LIST */}
                {syncDiscoveredComponents.length > 0 && (
                  <div className="space-y-3 pt-3 border-t border-slate-800 text-xs">
                    <div className="flex items-center justify-between">
                      <span className="font-bold text-white uppercase tracking-wider">
                        Discovered Components ({syncDiscoveredComponents.length})
                      </span>
                      <span className="text-[11px] text-slate-400">Select components to add to your Catalog:</span>
                    </div>

                    <div className="space-y-2 max-h-52 overflow-y-auto pr-1">
                      {syncDiscoveredComponents.map((comp) => {
                        const isChecked = !!syncSelectedToImport[comp.id];
                        const exists = componentSpecs.some(c => c.id === comp.id);
                        return (
                          <div
                            key={comp.id}
                            className={`p-3 rounded-2xl border flex items-center justify-between transition-all ${
                              isChecked ? 'bg-cyan-950/30 border-cyan-500/50' : 'bg-slate-900/60 border-slate-800'
                            }`}
                          >
                            <div className="flex items-center gap-3">
                              <input
                                type="checkbox"
                                checked={isChecked}
                                onChange={(e) => {
                                  const checked = e.target.checked;
                                  setSyncSelectedToImport(prev => ({ ...prev, [comp.id]: checked }));
                                }}
                                className="rounded bg-slate-950 border-slate-700 text-cyan-600 focus:ring-0"
                              />
                              <div>
                                <span className="font-bold text-white">{comp.name}</span>
                                <div className="text-[11px] text-slate-400 flex items-center gap-2 mt-0.5">
                                  <span>{comp.fields.length} field(s)</span>
                                  <span>&bull;</span>
                                  <span>Slot: <code className="text-cyan-300">{(comp.allowedPlaceholders || []).map(p => p.key).join(', ')}</code></span>
                                </div>
                              </div>
                            </div>

                            <div>
                              {exists ? (
                                <span className="px-2 py-0.5 rounded-full text-[10px] font-bold bg-amber-500/20 text-amber-300 border border-amber-500/30">
                                  Update Existing
                                </span>
                              ) : (
                                <span className="px-2 py-0.5 rounded-full text-[10px] font-bold bg-emerald-500/20 text-emerald-300 border border-emerald-500/30">
                                  New Component
                                </span>
                              )}
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                )}

                {/* MODAL ACTIONS */}
                <div className="flex items-center justify-between pt-4 border-t border-slate-800">
                  <button onClick={() => setSyncModalOpen(false)} className="px-4 py-2 text-xs text-slate-400 hover:text-white">
                    Cancel
                  </button>

                  <button
                    onClick={handleExecuteImport}
                    disabled={syncDiscoveredComponents.length === 0}
                    className="px-5 py-2.5 bg-gradient-to-r from-cyan-600 to-indigo-600 hover:from-cyan-500 disabled:from-slate-800 disabled:to-slate-800 disabled:text-slate-600 text-white rounded-xl text-xs font-bold shadow-lg shadow-cyan-600/30 active:scale-95 transition-all flex items-center gap-2"
                  >
                    <Icon name="checkCircle" className="w-4 h-4" />
                    <span>Import Selected into Catalog</span>
                  </button>
                </div>

              </div>
            </div>
          )}

          {/* ========================================================================= */}
          {/* MODAL 2: SETTINGS MODAL */}
          {/* ========================================================================= */}
          {settingsOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md">
              <div className="glass-panel rounded-3xl max-w-lg w-full p-6 sm:p-8 space-y-5 shadow-2xl border border-slate-800">
                <div className="flex items-center justify-between border-b border-slate-800 pb-4">
                  <h3 className="text-base font-bold text-white flex items-center gap-2.5">
                    <Icon name="settings" className="w-5 h-5 text-indigo-400" />
                    <span>Sitecore Layout Service Settings</span>
                  </h3>
                  <button onClick={() => setSettingsOpen(false)} className="text-slate-400 hover:text-white p-1">
                    <Icon name="x" className="w-5 h-5" />
                  </button>
                </div>

                <div className="space-y-4 text-xs">
                  <div>
                    <label className="text-slate-300 block mb-1.5 font-bold">Endpoint URL</label>
                    <input
                      type="text"
                      value={currentEnv.endpoint}
                      onChange={(e) => {
                        const val = e.target.value;
                        setEnvironments(prev => prev.map(env => env.id === currentEnv.id ? { ...env, endpoint: val } : env));
                      }}
                      className="w-full bg-slate-900 border border-slate-800 rounded-xl px-3.5 py-2 text-white font-mono text-xs focus:border-indigo-500 focus:outline-none"
                    />
                  </div>

                  <div>
                    <label className="text-slate-300 block mb-1.5 font-bold">Sitecore API Key</label>
                    <input
                      type="text"
                      value={currentEnv.apiKey}
                      onChange={(e) => {
                        const val = e.target.value;
                        setEnvironments(prev => prev.map(env => env.id === currentEnv.id ? { ...env, apiKey: val } : env));
                      }}
                      className="w-full bg-slate-900 border border-slate-800 rounded-xl px-3.5 py-2 text-white font-mono text-xs focus:border-indigo-500 focus:outline-none"
                    />
                  </div>

                  <div>
                    <label className="text-slate-300 block mb-1.5 font-bold">Site Name (sc_site)</label>
                    <input
                      type="text"
                      value={currentEnv.siteName || ''}
                      placeholder="e.g. mysite or headless-site"
                      onChange={(e) => {
                        const val = e.target.value;
                        setEnvironments(prev => prev.map(env => env.id === currentEnv.id ? { ...env, siteName: val } : env));
                      }}
                      className="w-full bg-slate-900 border border-slate-800 rounded-xl px-3.5 py-2 text-white font-mono text-xs focus:border-indigo-500 focus:outline-none"
                    />
                    <span className="text-[11px] text-slate-400 mt-1 block">Sitecore SXA site context passed in Layout Service requests</span>
                  </div>

                  <div>
                    <label className="text-slate-300 block mb-1.5 font-bold">Language (sc_lang)</label>
                    <input
                      type="text"
                      value={currentEnv.language || 'en'}
                      placeholder="e.g. en"
                      onChange={(e) => {
                        const val = e.target.value;
                        setEnvironments(prev => prev.map(env => env.id === currentEnv.id ? { ...env, language: val } : env));
                      }}
                      className="w-full bg-slate-900 border border-slate-800 rounded-xl px-3.5 py-2 text-white font-mono text-xs focus:border-indigo-500 focus:outline-none"
                    />
                  </div>
                </div>

                <div className="flex justify-end gap-3 pt-4 border-t border-slate-800">
                  <button onClick={() => setSettingsOpen(false)} className="px-4 py-2 text-xs text-slate-400 hover:text-white">
                    Close
                  </button>
                  <button
                    onClick={() => {
                      localStorage.setItem('sitecore_compass_envs', JSON.stringify(environments));
                      setSettingsOpen(false);
                      showToast('Saved settings');
                    }}
                    className="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-xs font-bold"
                  >
                    Save Changes
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
